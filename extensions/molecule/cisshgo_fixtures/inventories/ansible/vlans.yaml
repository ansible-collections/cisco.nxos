all:
  children:
    nxos_cisshgo:
      vars:
        ansible_connection: ansible.netcommon.network_cli
        ansible_network_os: cisco.nxos.nxos
        ansible_user: admin
        ansible_password: admin
        ansible_host: 127.0.0.1
        ansible_command_timeout: 200
        ansible_ssh_common_args: -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
        ansible_network_cli_ssh_type: libssh
        ansible_libssh_hostkeys: +ssh-rsa
        ansible_become: false
      children:
        nxos_vlans_gathered:
          hosts:
            cisshgo-vlans-gathered:
              ansible_port: 10001
        nxos_vlans_merged:
          hosts:
            cisshgo-vlans-merged:
              ansible_port: 10002
        nxos_vlans_replaced:
          hosts:
            cisshgo-vlans-replaced:
              ansible_port: 10003
        nxos_vlans_overridden:
          hosts:
            cisshgo-vlans-overridden:
              ansible_port: 10004
        nxos_vlans_deleted:
          hosts:
            cisshgo-vlans-deleted:
              ansible_port: 10005
        nxos_vlans_nve_overlay_gathered:
          hosts:
            cisshgo-vlans-nve-overlay-gathered:
              ansible_port: 10006
        nxos_vlans_nve_overlay_merged:
          hosts:
            cisshgo-vlans-nve-overlay-merged:
              ansible_port: 10007
        nxos_vlans_nve_overlay_replaced:
          hosts:
            cisshgo-vlans-nve-overlay-replaced:
              ansible_port: 10008
        nxos_vlans_nve_overlay_overridden:
          hosts:
            cisshgo-vlans-nve-overlay-overridden:
              ansible_port: 10009
        nxos_vlans_nve_overlay_deleted:
          hosts:
            cisshgo-vlans-nve-overlay-deleted:
              ansible_port: 10010
        nxos_vlans_nve_overlay_duplicate:
          hosts:
            cisshgo-vlans-nve-overlay-duplicate:
              ansible_port: 10011
