all:
  children:
    nxos_cisshgo:
      vars:
        ansible_connection: ansible.netcommon.network_cli
        ansible_network_os: cisco.nxos.nxos
        ansible_user: admin
        ansible_password: admin
        ansible_host: 127.0.0.1
        ansible_command_timeout: 200
        ansible_ssh_common_args: -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
        ansible_network_cli_ssh_type: libssh
        ansible_libssh_hostkeys: +ssh-rsa
        ansible_become: false
      children:
        nxos_nve_interface_gathered:
          hosts:
            cisshgo-nve_interface-gathered:
              ansible_port: 10000
        nxos_nve_interface_merged:
          hosts:
            cisshgo-nve_interface-merged:
              ansible_port: 10001
        nxos_nve_interface_replaced:
          hosts:
            cisshgo-nve_interface-replaced:
              ansible_port: 10002
        nxos_nve_interface_overridden:
          hosts:
            cisshgo-nve_interface-overridden:
              ansible_port: 10003
        nxos_nve_interface_deleted:
          hosts:
            cisshgo-nve_interface-deleted:
              ansible_port: 10004
        nxos_nve_interface_deleted_vnis:
          hosts:
            cisshgo-nve_interface-deleted_vnis:
              ansible_port: 10005
