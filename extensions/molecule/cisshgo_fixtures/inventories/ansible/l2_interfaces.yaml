all:
  children:
    nxos_cisshgo:
      vars:
        ansible_connection: ansible.netcommon.network_cli
        ansible_network_os: cisco.nxos.nxos
        ansible_user: admin
        ansible_password: admin
        ansible_host: 127.0.0.1
        ansible_command_timeout: 200
        ansible_ssh_common_args: -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
        ansible_network_cli_ssh_type: libssh
        ansible_libssh_hostkeys: +ssh-rsa
        ansible_become: false
      children:
        nxos_l2_interfaces_merged_implicit_vlans:
          hosts:
            cisshgo-l2_interfaces-merged_implicit_vlans:
              ansible_port: 10000
        nxos_l2_interfaces_action_states:
          hosts:
            cisshgo-l2_interfaces-action_states:
              ansible_port: 10001
        nxos_l2_interfaces_non_action_states:
          hosts:
            cisshgo-l2_interfaces-non_action_states:
              ansible_port: 10002
        nxos_l2_interfaces_port_channel_member:
          hosts:
            cisshgo-l2_interfaces-port_channel_member:
              ansible_port: 10003
