---
all:
  children:
    nxos_cisshgo:
      vars:
        ansible_connection: ansible.netcommon.network_cli
        ansible_network_os: cisco.nxos.nxos
        ansible_user: admin
        ansible_password: admin
        ansible_host: 127.0.0.1
        ansible_command_timeout: 200
        ansible_ssh_common_args: -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
        ansible_network_cli_ssh_type: libssh
        ansible_libssh_hostkeys: +ssh-rsa
        ansible_become: false
      children:
        nxos_vpc_gathered:
          hosts:
            cisshgo-vpc-gathered:
              ansible_port: 10000
        nxos_vpc_merged:
          hosts:
            cisshgo-vpc-merged:
              ansible_port: 10001
        nxos_vpc_replaced:
          hosts:
            cisshgo-vpc-replaced:
              ansible_port: 10002
        nxos_vpc_overridden:
          hosts:
            cisshgo-vpc-overridden:
              ansible_port: 10003
        nxos_vpc_deleted:
          hosts:
            cisshgo-vpc-deleted:
              ansible_port: 10004
        nxos_vpc_new_attributes:
          hosts:
            cisshgo-vpc-new-attributes:
              ansible_port: 10005
