all:
  children:
    nxos_cisshgo:
      vars:
        ansible_connection: ansible.netcommon.network_cli
        ansible_network_os: cisco.nxos.nxos
        ansible_user: admin
        ansible_password: admin
        ansible_host: 127.0.0.1
        ansible_command_timeout: 200
        ansible_ssh_common_args: -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
        ansible_network_cli_ssh_type: libssh
        ansible_libssh_hostkeys: +ssh-rsa
        ansible_become: false
      children:
        nxos_snmp_server_gathered:
          hosts:
            cisshgo-snmp_server-gathered:
              ansible_port: 10001
        nxos_snmp_server_merged:
          hosts:
            cisshgo-snmp_server-merged:
              ansible_port: 10002
        nxos_snmp_server_replaced:
          hosts:
            cisshgo-snmp_server-replaced:
              ansible_port: 10003
        nxos_snmp_server_overridden:
          hosts:
            cisshgo-snmp_server-overridden:
              ansible_port: 10004
