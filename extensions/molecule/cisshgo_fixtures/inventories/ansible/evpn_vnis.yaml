all:
  children:
    nxos_cisshgo:
      vars:
        ansible_connection: ansible.netcommon.network_cli
        ansible_network_os: cisco.nxos.nxos
        ansible_user: admin
        ansible_password: admin
        ansible_host: 127.0.0.1
        ansible_command_timeout: 200
        ansible_ssh_common_args: -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
        ansible_network_cli_ssh_type: libssh
        ansible_libssh_hostkeys: +ssh-rsa
        ansible_become: false
      children:
        nxos_evpn_vnis_gathered:
          hosts:
            cisshgo-evpn_vnis-gathered:
              ansible_port: 10000
        nxos_evpn_vnis_merged:
          hosts:
            cisshgo-evpn_vnis-merged:
              ansible_port: 10001
        nxos_evpn_vnis_replaced:
          hosts:
            cisshgo-evpn_vnis-replaced:
              ansible_port: 10002
        nxos_evpn_vnis_overridden:
          hosts:
            cisshgo-evpn_vnis-overridden:
              ansible_port: 10003
        nxos_evpn_vnis_deleted:
          hosts:
            cisshgo-evpn_vnis-deleted:
              ansible_port: 10004
        nxos_evpn_vnis_deleted_all:
          hosts:
            cisshgo-evpn_vnis-deleted_all:
              ansible_port: 10005
