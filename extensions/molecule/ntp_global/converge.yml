- name: "Nxos_ntp_global — state: gathered"
  hosts: nxos_ntp_global_gathered
  gather_facts: false
  vars_files:
    - ../../../tests/integration/targets/nxos_ntp_global/vars/main.yml
  tasks:
    - name: Gather nxos_ntp_global facts
      register: result
      cisco.nxos.nxos_ntp_global:
        state: gathered
    - name: Assert gathered
      ansible.builtin.assert:
        that:
          - result.changed == false
          - result.gathered == merged.after

- name: "Nxos_ntp_global — state: merged"
  hosts: nxos_ntp_global_merged
  gather_facts: false
  vars_files:
    - ../../../tests/integration/targets/nxos_ntp_global/vars/main.yml
  tasks:
    - name: Run nxos_ntp_global merged
      register: result
      cisco.nxos.nxos_ntp_global:
        config:
          access_group:
            peer:
              - access_list: PeerAcl1
            serve:
              - access_list: ServeAcl1
          authenticate: true
          logging: true
          master:
            stratum: 2
          peers:
            - key_id: 1
              maxpoll: 15
              minpoll: 5
              peer: 192.0.2.1
              vrf: default
            - key_id: 2
              peer: 192.0.2.2
              prefer: true
              vrf: siteA
          servers:
            - key_id: 2
              server: 198.51.100.1
              vrf: default
            - key_id: 1
              server: 203.0.113.1
              vrf: siteB
        state: merged
    - name: Assert commands
      ansible.builtin.assert:
        that:
          - result.commands | symmetric_difference(merged.commands) | length == 0
    - name: Idempotent re-run (merged)
      register: idempotent_result
      cisco.nxos.nxos_ntp_global:
        config:
          access_group:
            peer:
              - access_list: PeerAcl1
            serve:
              - access_list: ServeAcl1
          authenticate: true
          logging: true
          master:
            stratum: 2
          peers:
            - key_id: 1
              maxpoll: 15
              minpoll: 5
              peer: 192.0.2.1
              vrf: default
            - key_id: 2
              peer: 192.0.2.2
              prefer: true
              vrf: siteA
          servers:
            - key_id: 2
              server: 198.51.100.1
              vrf: default
            - key_id: 1
              server: 203.0.113.1
              vrf: siteB
        state: merged
    - name: Assert idempotent (no changes)
      ansible.builtin.assert:
        that:
          - idempotent_result.changed == false
          - idempotent_result.commands | length == 0

