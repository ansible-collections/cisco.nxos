---
- name: "Nxos_nve_interface — state: gathered"
  hosts: nxos_nve_interface_gathered
  gather_facts: false
  vars_files:
    - ../../../tests/integration/targets/nxos_nve_interface/vars/main.yaml
  tasks:
    - name: Gather nxos_nve_interface facts
      register: result
      cisco.nxos.nxos_nve_interface:
        state: gathered
    - name: Assert gathered
      ansible.builtin.assert:
        that:
          - result.changed == false
          - gathered.config == result.gathered

- name: "Nxos_nve_interface — state: merged"
  hosts: nxos_nve_interface_merged
  gather_facts: false
  vars_files:
    - ../../../tests/integration/targets/nxos_nve_interface/vars/main.yaml
  tasks:
    - name: Run nxos_nve_interface merged
      register: result
      cisco.nxos.nxos_nve_interface: &merged
        config:
          enabled: true
          description: vxlan vtep
          advertise_virtual_rmac: true
          host_reachability_bgp: true
          source_interface_name: loopback1
          source_interface_hold_time: 60
          global_multicast_group:
            address: 233.252.0.20
            mode: L2
          vnis:
            - vni_id: 11111
              associate_vrf: true
            - vni_id: 22222
            - vni_id: 33333
              suppress_arp: true
            - vni_id: 44444
              mcast_group:
                address: 233.252.0.10
            - vni_id: 55555
              mcast_group:
                address: 233.252.0.11
        state: merged
    - name: Assert merged commands
      ansible.builtin.assert:
        that:
          - result.changed == true
          - merged.commands | symmetric_difference(result.commands) | length == 0
          - result.commands | length == merged.commands | length
          - merged.before == result.before
          - merged.after == result.after
    - name: Idempotent re-run (merged)
      register: idempotent_result
      cisco.nxos.nxos_nve_interface: *merged
    - name: Assert idempotent (merged)
      ansible.builtin.assert:
        that:
          - idempotent_result.changed == false
          - idempotent_result.commands | length == 0

    - name: Merge mutually exclusive per-VNI options (expected to fail)
      register: result_exclusive
      ignore_errors: true
      cisco.nxos.nxos_nve_interface:
        config:
          vnis:
            - vni_id: 44444
              mcast_group:
                address: 233.252.0.10
              ingress_replication_bgp: true
        state: merged
    - name: Assert mutually exclusive options were rejected
      ansible.builtin.assert:
        that:
          - result_exclusive.failed == true
          - "'mutually exclusive' in result_exclusive.msg"

