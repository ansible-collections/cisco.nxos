---
# AUTO-GENERATED — rename to converge.yml after review.
# Manual review needed only for complex idempotent edge cases or custom assertions.

- name: "Nxos_vrf_address_family — state: gathered"
  hosts: nxos_vrf_address_family_gathered
  gather_facts: false
  vars_files:
    - ../../../tests/integration/targets/nxos_vrf_address_family/vars/main.yaml
  tasks:
    - name: Gather nxos_vrf_address_family facts
      register: result
      cisco.nxos.nxos_vrf_address_family:
        state: gathered
    - name: Assert gathered
      ansible.builtin.assert:
        that:
          - result.changed == false
          - gathered == result.gathered

- name: "Nxos_vrf_address_family — state: merged"
  hosts: nxos_vrf_address_family_merged
  gather_facts: false
  vars_files:
    - ../../../tests/integration/targets/nxos_vrf_address_family/vars/main.yaml
  tasks:
    - name: Run nxos_vrf_address_family merged
      register: result
      cisco.nxos.nxos_vrf_address_family: &merged
        config:
          - name: VRF1
            address_families:
              - afi: ipv4
                safi: unicast
                route_target:
                  - export: "65512:200"
                maximum:
                  max_routes: 500
                  max_route_options:
                    threshold:
                      threshold_value: 60
                      reinstall_threshold: 80
                export:
                  - map: "22"
                  - vrf:
                      allow_vpn: true
                      map_import: "44"
                  - vrf:
                      allow_vpn: true
              - afi: ipv6
                safi: unicast
                maximum:
                  max_routes: 1000
                route_target:
                  - import: "65512:200"
                import:
                  - map: "22"
                  - vrf:
                      advertise_vpn: true
                      map_import: "44"
                  - vrf:
                      advertise_vpn: true
        state: merged
    - name: Assert commands
      ansible.builtin.assert:
        that:
          - result.changed == true
          - result.commands | symmetric_difference(merged.commands) | length == 0
    - name: Idempotent re-run (merged)
      register: idempotent_result
      cisco.nxos.nxos_vrf_address_family: *merged
    - name: Assert idempotent (no changes)
      ansible.builtin.assert:
        that:
          - idempotent_result.changed == false
          - idempotent_result.commands | length == 0

