- name: Rendered state (offline)
  hosts: nxos_evpn_vnis_gathered
  gather_facts: false
  vars_files:
    - ../../../tests/integration/targets/nxos_evpn_vnis/vars/main.yml
  tasks:
    - name: Run nxos_evpn_vnis rendered
      register: result
      cisco.nxos.nxos_evpn_vnis:
        config:
          - vni: 10100
            route_distinguisher: auto
            route_target_both:
              - auto
          - vni: 10200
            route_distinguisher: "65000:10200"
            route_target_import:
              - "65000:10200"
        state: rendered
    - name: Assert rendered commands
      ansible.builtin.assert:
        that:
          - rendered['commands'] == result['rendered']
          - result.changed == false

- name: Parsed state (offline)
  hosts: nxos_evpn_vnis_gathered
  gather_facts: false
  vars_files:
    - ../../../tests/integration/targets/nxos_evpn_vnis/vars/main.yml
  tasks:
    - name: Run nxos_evpn_vnis parsed
      register: result
      cisco.nxos.nxos_evpn_vnis:
        running_config: "{{ lookup('file', playbook_dir + '/../../../tests/integration/targets/nxos_evpn_vnis/tests/common/fixtures/parsed.cfg') }}"
        state: parsed
    - name: Assert parsed result
      ansible.builtin.assert:
        that:
          - merged['before'] == result['parsed']
