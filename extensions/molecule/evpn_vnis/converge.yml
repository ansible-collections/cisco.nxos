---
- name: "Nxos_evpn_vnis — state: gathered"
  hosts: nxos_evpn_vnis_gathered
  gather_facts: false
  vars_files:
    - ../../../tests/integration/targets/nxos_evpn_vnis/vars/main.yml
  tasks:
    - name: Gather nxos_evpn_vnis facts
      register: result
      cisco.nxos.nxos_evpn_vnis:
        state: gathered
    - name: Assert gathered
      ansible.builtin.assert:
        that:
          - result.changed == false
          - merged['before'] == result['gathered']

- name: "Nxos_evpn_vnis — state: merged"
  hosts: nxos_evpn_vnis_merged
  gather_facts: false
  vars_files:
    - ../../../tests/integration/targets/nxos_evpn_vnis/vars/main.yml
  tasks:
    - name: Run nxos_evpn_vnis merged
      register: result
      cisco.nxos.nxos_evpn_vnis: &merged
        config:
          - vni: 10100
            route_target_both:
              - 65000:10100
          - vni: 10300
            route_distinguisher: auto
        state: merged
    - name: Assert merged result
      ansible.builtin.assert:
        that:
          - result.changed == true
          - merged['before'] == result['before']
          - merged['commands'] == result['commands']
          - merged['after'] == result['after']
    - name: Idempotent re-run (merged)
      register: idempotent_result
      cisco.nxos.nxos_evpn_vnis: *merged
    - name: Assert idempotent (merged)
      ansible.builtin.assert:
        that:
          - idempotent_result.changed == false
          - idempotent_result.commands | length == 0

