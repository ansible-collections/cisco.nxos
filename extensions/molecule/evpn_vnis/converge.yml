  gather_facts: false
  vars_files:
    - ../../../tests/integration/targets/nxos_evpn_vnis/vars/main.yml
  tasks:
    - name: Run nxos_evpn_vnis deleted without config
      register: result
      cisco.nxos.nxos_evpn_vnis: &deleted_all
        state: deleted
    - name: Assert deleted result
      ansible.builtin.assert:
        that:
