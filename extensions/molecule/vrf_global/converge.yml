---
# AUTO-GENERATED — rename to converge.yml after review.
# Manual review needed only for complex idempotent edge cases or custom assertions.

- name: "Nxos_vrf_global — state: gathered"
  hosts: nxos_vrf_global_gathered
  gather_facts: false
  vars_files:
    - ../../../tests/integration/targets/nxos_vrf_global/vars/main.yaml
  tasks:
    - name: Gather nxos_vrf_global facts
      register: result
      cisco.nxos.nxos_vrf_global:
        state: gathered
    - name: Remove management from gathered result
      ansible.builtin.set_fact:
        res_parsed:
          gathered:
            vrfs: "{{ result.gathered.vrfs | rejectattr('name', '==', 'management') | list }}"
    - name: Assert gathered
      ansible.builtin.assert:
        that:
          - result.changed == false
          - gathered.after == res_parsed.gathered

- name: "Nxos_vrf_global — state: merged"
  hosts: nxos_vrf_global_merged
  gather_facts: false
  vars_files:
    - ../../../tests/integration/targets/nxos_vrf_global/vars/main.yaml
  vars:
    # Lab recording used the isci path (no service-reflect / group-range extras).
    symmetric_diff:
      - ip multicast multipath legacy
      - ipv6 multicast group-range prefix-list temp
      - multicast service-reflect interface Ethernet1/1 map interface Ethernet2/2
      - multicast service-reflect interface Ethernet2/1 map interface Ethernet4/2
    vrf_config:
      vrfs:
        - description: this-is-test
          ip:
            auto_discard: true
            domain_list:
              - example.net
            domain_name: example.org
            icmp_err:
              source_interface:
                interface: port-channel
                interface_value: "1"
            igmp:
              ssm_translate:
                - group: 232.0.0.0/8
                  source: 10.1.1.1
                - group: 239.1.2.0/24
                  source: 192.168.1.1
            mroutes:
              - group: 192.168.1.0/24
                source: 192.168.1.1
              - group: 192.168.1.0/24
                preference: 2
                source: 192.168.1.2
                vrf: temp
            multicast:
              multipath:
                resilient: true
              rpf:
                - group_list_range: 238.1.0.0/24
                  vrf_name: temp
                - group_list_range: 239.1.0.0/24
                  vrf_name: temp
            name_server:
              address_list:
                - 192.168.0.1
                - 192.168.0.2
                - 192.168.1.1
                - 192.169.1.3
              use_vrf:
                source_address: 192.168.0.1
                vrf: temp
            route:
              - destination: 192.0.2.22
                source: 192.0.0.0/24
              - destination: 192.0.2.22
                source: 192.0.0.0/24
                vrf: temp
              - destination: 192.0.2.22
                source: 192.0.2.0/24
                tags:
                  route_pref: 4
                  tag_value: 2
          ipv6:
            mld_ssm_translate:
              - group: ff28::/16
                source: 2001:db8:0:abcd::2
              - group: ff30::/16
                source: 2001:db8:0:abcd::5
            multicast:
              multipath:
                resilient: true
                splitting_type:
                  none: true
          name: VRF7
          vni:
            vni_number: 5
  tasks:
    - name: Run nxos_vrf_global merged
      register: result
      cisco.nxos.nxos_vrf_global: &merged
        config: "{{ vrf_config }}"
        state: merged
    - name: Assert commands
      ansible.builtin.assert:
        that:
          - result.changed == true
          - merged.commands | difference(symmetric_diff) | symmetric_difference(result.commands) | length == 0
    - name: Idempotent re-run (merged)
      register: idempotent_result
      cisco.nxos.nxos_vrf_global: *merged
    - name: Assert idempotent (no changes)
      ansible.builtin.assert:
        that:
          - idempotent_result.changed == false
          - idempotent_result.commands | length == 0

