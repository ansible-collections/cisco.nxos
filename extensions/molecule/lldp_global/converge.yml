- name: "Nxos_lldp_global -- state: deleted"
  hosts: nxos_lldp_global_deleted
  gather_facts: false
  tasks:
    - name: Apply deleted state
      register: result
      cisco.nxos.nxos_lldp_global:
        state: deleted

    - name: Assert deleted commands
      ansible.builtin.assert:
        that:
          - result.changed == true
          - result.commands | symmetric_difference(deleted_commands) | length == 0
      vars:
        deleted_commands:
          - no lldp holdtime 125
          - no lldp portid-subtype 1
          - no lldp timer 32
          - lldp tlv-select dcbxp
          - lldp tlv-select power-management
          - lldp tlv-select system-description

    - name: Idempotence - deleted
      register: result
      cisco.nxos.nxos_lldp_global:
        state: deleted

    - name: Assert idempotent (deleted)
      ansible.builtin.assert:
        that:
          - result.changed == false
          - result.commands | length == 0

- name: "Nxos_lldp_global -- state: parsed"
  hosts: nxos_lldp_global_gathered
  gather_facts: false
  vars_files:
    - "{{ playbook_dir }}/../../../tests/integration/targets/nxos_lldp_global/vars/main.yml"
  tasks:
    - name: Run nxos_lldp_global parsed
      register: result
      cisco.nxos.nxos_lldp_global:
        running_config: |
          lldp holdtime 131
          lldp reinit 7
          no lldp tlv-select system-name
          no lldp tlv-select system-description
        state: parsed

    - name: Assert parsed config
      ansible.builtin.assert:
        that:
          - parsed == result.parsed
          - result.changed == false

- name: "Nxos_lldp_global -- state: rendered"
  hosts: nxos_lldp_global_gathered
  gather_facts: false
  vars_files:
    - "{{ playbook_dir }}/../../../tests/integration/targets/nxos_lldp_global/vars/main.yml"
  tasks:
    - name: Render lldp_global configuration
      register: result
      cisco.nxos.nxos_lldp_global:
        config:
          holdtime: 130
          port_id: 1
          reinit: 5
          tlv_select:
            dcbxp: true
            power_management: true
        state: rendered

    - name: Assert rendered commands
      ansible.builtin.assert:
        that:
          - rendered | symmetric_difference(result.rendered) | length == 0
          - result.changed == false
