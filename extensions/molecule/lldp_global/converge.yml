---
- name: "Nxos_lldp_global -- state: gathered"
  hosts: nxos_lldp_global_gathered
  gather_facts: false
  vars_files:
    - "{{ playbook_dir }}/../../../tests/integration/targets/nxos_lldp_global/vars/main.yml"
  tasks:
    - name: Gather lldp_global facts
      register: result
      cisco.nxos.nxos_lldp_global:
        state: gathered

    - name: Assert gathered matches expected
      ansible.builtin.assert:
        that:
          - gathered == result.gathered
          - result.changed == false

- name: "Nxos_lldp_global -- state: merged"
  hosts: nxos_lldp_global_merged
  gather_facts: false
  tasks:
    - name: Apply merged config
      register: result
      cisco.nxos.nxos_lldp_global: &merged_config
        config:
          reinit: 5
          timer: 40
          port_id: 1
          tlv_select:
            power_management: false
        state: merged

    - name: Assert merged commands
      ansible.builtin.assert:
        that:
          - result.changed == true
          - result.commands | symmetric_difference(merged_commands) | length == 0
      vars:
        merged_commands:
          - lldp timer 40
          - no lldp tlv-select power-management
          - lldp portid-subtype 1
          - lldp reinit 5

    - name: Idempotence - merged
      register: result
      cisco.nxos.nxos_lldp_global: *merged_config

    - name: Assert idempotent (merged)
      ansible.builtin.assert:
        that:
          - result.changed == false
          - result.commands | length == 0

- name: "Nxos_lldp_global -- state: replaced"
  hosts: nxos_lldp_global_replaced
  gather_facts: false
  tasks:
    - name: Apply replaced config
      register: result
      cisco.nxos.nxos_lldp_global: &replaced_config
        config:
          holdtime: 125
          timer: 35
          tlv_select:
            system:
              name: false
              description: false
            port:
              vlan: false
            dcbxp: false
        state: replaced

    - name: Assert replaced commands
      ansible.builtin.assert:
        that:
          - result.changed == true
          - result.commands | symmetric_difference(replaced_commands) | length == 0
      vars:
        replaced_commands:
          - no lldp portid-subtype 1
          - lldp tlv-select power-management
          - no lldp tlv-select system-name
          - no lldp tlv-select system-description
          - no lldp tlv-select dcbxp
          - lldp timer 35

    - name: Idempotence - replaced
      register: result
      cisco.nxos.nxos_lldp_global: *replaced_config

    - name: Assert idempotent (replaced)
      ansible.builtin.assert:
        that:
          - result.changed == false
          - result.commands | length == 0

