- name: Parsed state (offline)
  hosts: nxos_vrf_interfaces_gathered
  gather_facts: false
  vars_files:
    - ../../../tests/integration/targets/nxos_vrf_interfaces/vars/main.yaml
  tasks:
    - name: Run nxos_vrf_interfaces parsed
      register: result
      cisco.nxos.nxos_vrf_interfaces:
        running_config: "{{ lookup('file', playbook_dir + '/../../../tests/integration/targets/nxos_vrf_interfaces/tests/common/_parsed.cfg') }}"
