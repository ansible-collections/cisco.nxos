---
# AUTO-GENERATED — rename to converge.yml after review.
# Manual review needed only for complex idempotent edge cases or custom assertions.

- name: "Nxos_vrf_interfaces — state: gathered"
  hosts: nxos_vrf_interfaces_gathered
  gather_facts: false
  vars_files:
    - ../../../tests/integration/targets/nxos_vrf_interfaces/vars/main.yaml
  tasks:
    - name: Gather nxos_vrf_interfaces facts
      register: result
      cisco.nxos.nxos_vrf_interfaces:
        state: gathered
    - name: Assert gathered
      ansible.builtin.assert:
        that:
          - result.changed == false
          - >-
            result.gathered
            | selectattr('name', 'in', 'Ethernet1/2,Ethernet1/6')
            | list
            | symmetric_difference(gathered.config)
            | length == 0

- name: "Nxos_vrf_interfaces — state: merged"
  hosts: nxos_vrf_interfaces_merged
  gather_facts: false
  vars_files:
    - ../../../tests/integration/targets/nxos_vrf_interfaces/vars/main.yaml
  tasks:
    - name: Run nxos_vrf_interfaces merged
      register: result
      cisco.nxos.nxos_vrf_interfaces: &merged
        config:
          - name: Ethernet1/2
            vrf_name: test
          - name: Ethernet1/6
            vrf_name: test2
        state: merged
    - name: Assert commands
      ansible.builtin.assert:
        that:
          - result.changed == true
          - result.commands | symmetric_difference(merged.commands) | length == 0
    - name: Idempotent re-run (merged)
      register: idempotent_result
      cisco.nxos.nxos_vrf_interfaces: *merged
    - name: Assert idempotent (no changes)
      ansible.builtin.assert:
        that:
          - idempotent_result.changed == false
          - idempotent_result.commands | length == 0

