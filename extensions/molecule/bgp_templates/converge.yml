- name: "Nxos_bgp_templates — state: gathered"
  hosts: nxos_bgp_templates_gathered
  gather_facts: false
  vars_files:
    - "{{ playbook_dir }}/../../../tests/integration/targets/nxos_bgp_templates/vars/main.yml"
  tasks:
    - name: Gather nxos_bgp_templates facts
      register: result
      cisco.nxos.nxos_bgp_templates:
        state: gathered
    - name: Assert gathered
      ansible.builtin.assert:
        that:
          - result.changed == false
          - merged.after == result.gathered

- name: "Nxos_bgp_templates — state: merged"
  hosts: nxos_bgp_templates_merged
  gather_facts: false
  vars_files:
    - "{{ playbook_dir }}/../../../tests/integration/targets/nxos_bgp_templates/vars/main.yml"
  tasks:
    - name: Run nxos_bgp_templates merged
      register: result
      cisco.nxos.nxos_bgp_templates:
        config:
          as_number: 65536
          neighbor:
            - address_family:
                - advertise_map:
                    non_exist_map: nemap1
                    route_map: rmap1
                  advertisement_interval: 60
                  afi: ipv4
                  disable_peer_as_check: true
                  safi: unicast
              bmp_activate_server: 2
              capability:
                suppress_4_byte_as: true
              description: Test_BGP_PEER_TEMPLATE_1
              local_as: 65536
              name: neighbor_tmplt_1
              remote_as: 65001
            - address_family:
                - advertise_map:
                    exist_map: emap1
                    route_map: rmap1
                  afi: ipv4
                  as_override: true
                  filter_list:
                    inbound: flist1
                    outbound: flist2
                  safi: multicast
              description: Test_BGP_PEER_TEMPLATE_2
              inherit:
                peer_session: psession1
              name: neighbor_tmplt_2
              timers:
                holdtime: 100
                keepalive: 45
        state: merged
    - name: Assert commands
      ansible.builtin.assert:
        that:
          - result.commands | symmetric_difference(merged.commands) | length == 0
    - name: Idempotent re-run (merged)
      register: idempotent_result
      cisco.nxos.nxos_bgp_templates:
        config:
          as_number: 65536
          neighbor:
            - address_family:
                - advertise_map:
                    non_exist_map: nemap1
                    route_map: rmap1
                  advertisement_interval: 60
                  afi: ipv4
                  disable_peer_as_check: true
                  safi: unicast
              bmp_activate_server: 2
              capability:
                suppress_4_byte_as: true
              description: Test_BGP_PEER_TEMPLATE_1
              local_as: 65536
              name: neighbor_tmplt_1
              remote_as: 65001
            - address_family:
                - advertise_map:
                    exist_map: emap1
                    route_map: rmap1
                  afi: ipv4
                  as_override: true
                  filter_list:
                    inbound: flist1
                    outbound: flist2
                  safi: multicast
              description: Test_BGP_PEER_TEMPLATE_2
              inherit:
                peer_session: psession1
              name: neighbor_tmplt_2
              timers:
                holdtime: 100
                keepalive: 45
        state: merged
    - name: Assert idempotent (no changes)
      ansible.builtin.assert:
