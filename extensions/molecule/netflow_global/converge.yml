---
- name: "Nxos_netflow_global — state: gathered"
  hosts: nxos_netflow_global_gathered
  gather_facts: false
  vars_files:
    - ../../../tests/integration/targets/nxos_netflow_global/vars/main.yml
  tasks:
    - name: Gather nxos_netflow_global facts
      register: result
      cisco.nxos.nxos_netflow_global:
        state: gathered
    - name: Assert gathered
      ansible.builtin.assert:
        that:
          - result.changed == false
          - before == result['gathered']

    - name: Run nxos_netflow_global parsed (offline)
      register: result
      cisco.nxos.nxos_netflow_global:
        running_config: "{{ lookup('file', playbook_dir + '/../../../tests/integration/targets/nxos_netflow_global/tests/common/fixtures/parsed.cfg') }}"
        state: parsed
    - name: Assert parsed result
      ansible.builtin.assert:
        that:
          - before == result['parsed']

    - name: Run nxos_netflow_global rendered (offline)
      register: result
      cisco.nxos.nxos_netflow_global:
        config:
          timeout: 20
          exporters:
            - name: ansible_exp1
              description: Collector 1
              destination:
                address: 192.0.2.10
                vrf: management
              source: Eth1/1
              transport_udp: 9996
              dscp: 10
              template_data_timeout: 600
              option_exporter_stats_timeout: 300
              option_interface_table_timeout: 400
          records:
            - name: ansible_rec1
              description: IPv4 flows
              match:
                ipv4:
                  source_address: true
                  destination_address: true
                ip:
                  protocol: true
                  tos: true
                transport:
                  source_port: true
                  destination_port: true
              collect:
                counter:
                  bytes: true
                  packets: true
                timestamp_sys_uptime:
                  first: true
                  last: true
                transport_tcp_flags: true
                ip_version: true
          monitors:
            - name: ansible_mon1
              description: Monitor 1
              record: ansible_rec1
              exporters:
                - ansible_exp1
        state: rendered
    - name: Assert rendered commands
      ansible.builtin.assert:
        that:
          - result.changed == false
          - rendered['commands'] == result['rendered']

- name: "Nxos_netflow_global — state: merged"
  hosts: nxos_netflow_global_merged
  gather_facts: false
  vars_files:
    - ../../../tests/integration/targets/nxos_netflow_global/vars/main.yml
  tasks:
    - name: Run nxos_netflow_global merged
      register: result
      cisco.nxos.nxos_netflow_global: &merged
        config:
          timeout: 10
          exporters:
            - name: ansible_exp1
              dscp: 0
              source: Loopback2
              option_interface_table_timeout: 400
            - name: ansible_exp3
              destination:
                address: 2001:db8::1
                vrf: management
          records:
            - name: ansible_rec1
              match:
                ip:
                  protocol: true
                transport:
                  source_port: false
              collect:
                counter:
                  packets: true
          monitors:
            - name: ansible_mon2
              record: netflow ipv4 original-input
              description: Monitor 2
        state: merged
    - name: Assert merged result
      ansible.builtin.assert:
        that:
          - result.changed == true
          - before == result['before']
          - merged['commands'] == result['commands']
          - merged['after'] == result['after']
    - name: Idempotent re-run (merged)
      register: idempotent_result
      cisco.nxos.nxos_netflow_global: *merged
    - name: Assert idempotent (merged)
      ansible.builtin.assert:
        that:
          - idempotent_result.changed == false
          - idempotent_result.commands | length == 0

