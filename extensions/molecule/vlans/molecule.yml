driver:
  name: default
platforms:
  - name: cisshgo-vlans-gathered
  - name: cisshgo-vlans-merged
  - name: cisshgo-vlans-replaced
  - name: cisshgo-vlans-overridden
  - name: cisshgo-vlans-deleted
  - name: cisshgo-vlans-nve-overlay-gathered
  - name: cisshgo-vlans-nve-overlay-merged
  - name: cisshgo-vlans-nve-overlay-replaced
  - name: cisshgo-vlans-nve-overlay-overridden
  - name: cisshgo-vlans-nve-overlay-deleted
  - name: cisshgo-vlans-nve-overlay-duplicate
provisioner:
  name: ansible
  inventory:
    links:
      hosts: ../cisshgo_fixtures/inventories/ansible/vlans.yaml
  env:
    ANSIBLE_FORCE_COLOR: "true"
    ANSIBLE_HOST_KEY_CHECKING: "false"
    ANSIBLE_DEPRECATION_WARNINGS: "false"
  playbooks:
    create: ../_shared/create.yml
    converge: converge.yml
    verify: ../_shared/verify.yml
    destroy: ../_shared/destroy.yml
scenario:
  test_sequence:
    - create
    - converge
    - verify
    - destroy
prerun: false
verifier:
  name: ansible
