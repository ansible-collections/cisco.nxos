---
# AUTO-GENERATED — rename to converge.yml after review.
# Manual review needed only for complex idempotent edge cases or custom assertions.

- name: "Nxos_vlans — state: gathered"
  hosts: nxos_vlans_gathered
  gather_facts: false
  vars_files:
    - ../../../tests/integration/targets/nxos_vlans/vars/main.yml
  tasks:
    - name: Gather nxos_vlans facts
      register: result
      cisco.nxos.nxos_vlans:
        state: gathered
    - name: Assert gathered
      ansible.builtin.assert:
        that:
          - result.changed == false
          - result.gathered | symmetric_difference(gathered) | length == 0

- name: "Nxos_vlans — state: merged"
  hosts: nxos_vlans_merged
  gather_facts: false
  vars_files:
    - ../../../tests/integration/targets/nxos_vlans/vars/main.yml
  tasks:
    - name: Run nxos_vlans merged
      register: result
      cisco.nxos.nxos_vlans: &merged
        config:
          - vlan_id: 5
            name: vlan5
          - vlan_id: 6
            name: vlan6
            state: suspend
        state: merged
    - name: Assert merged commands
      ansible.builtin.assert:
        that:
          - result.changed == true
          - result.before|length == 1
          - "'vlan 5' in result.commands"
          - "'name vlan5' in result.commands"
          - "'vlan 6' in result.commands"
          - "'name vlan6' in result.commands"
          - "'state suspend' in result.commands"
          - result.commands|length == 5
    - name: Idempotent re-run (merged)
      register: idempotent_result
      cisco.nxos.nxos_vlans: *merged
    - name: Assert idempotent (merged)
      ansible.builtin.assert:
        that:
          - idempotent_result.changed == false
          - idempotent_result.commands | length == 0

