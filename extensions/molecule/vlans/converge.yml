- name: "Nxos_vlans — state: overridden"
  hosts: nxos_vlans_overridden
  gather_facts: false
  vars_files:
    - ../../../tests/integration/targets/nxos_vlans/vars/main.yml
  tasks:
    - name: Run nxos_vlans overridden
      register: result
      cisco.nxos.nxos_vlans: &overridden
        config:
          - vlan_id: 1
            enabled: true
            mode: ce
            name: default
            state: active
          - vlan_id: 9
            name: test-vlan9
            enabled: false
        state: overridden
    - name: Assert overridden commands
      ansible.builtin.assert:
        that:
          - result.changed == true
          - "'no vlan 5' in result.commands"
          - "'no vlan 6' in result.commands"
          - "'vlan 9' in result.commands"
          - "'name test-vlan9' in result.commands"
          - "'shutdown' in result.commands"
          - result.commands|length == 5
    - name: Idempotent re-run (overridden)
      register: idempotent_result
