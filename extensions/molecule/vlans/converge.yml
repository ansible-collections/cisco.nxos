- name: "Nxos_vlans — nve_overlay: duplicate vlan_id"
  hosts: nxos_vlans_nve_overlay_duplicate
  gather_facts: false
  tasks:
    - name: Repeat a vlan_id in config
      register: result_duplicate
      ignore_errors: true
      cisco.nxos.nxos_vlans:
        config:
          - vlan_id: 3801
            nve_overlay: true
          - vlan_id: 3801
            nve_overlay: false
        state: merged
    - name: Assert the duplicate is rejected before any command is sent
      ansible.builtin.assert:
        that:
          - result_duplicate.failed == true
          - "'vlan_id 3801 is listed more than once in config' in result_duplicate.msg"
