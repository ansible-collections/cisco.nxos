- name: "Nxos_vlans — nve_overlay: gathered"
  hosts: nxos_vlans_nve_overlay_gathered
  gather_facts: false
  tasks:
    - name: Gather nxos_vlans facts with a compressed nve-overlay range
      register: result
      cisco.nxos.nxos_vlans:
        state: gathered
    - name: Assert nve_overlay is gathered per vlan and mapped_vni is kept for a vn-segment only block
      ansible.builtin.assert:
        that:
          - result.changed == false
          - result.gathered | length == 5
          - result.gathered | symmetric_difference(expected) | length == 0
      vars:
        expected:
          - vlan_id: 1
            enabled: true
            mode: ce
            state: active
            name: default
          - vlan_id: 3801
            enabled: true
            mode: ce
            state: active
            mapped_vni: 50001
            nve_overlay: true
          - vlan_id: 3802
            enabled: true
            mode: ce
            state: active
            nve_overlay: true
          - vlan_id: 3810
            enabled: true
            mode: ce
            state: active
          - vlan_id: 3820
            enabled: true
            mode: ce
            state: active
            name: ex-3820
            nve_overlay: true

- name: "Nxos_vlans — nve_overlay: merged"
  hosts: nxos_vlans_nve_overlay_merged
  gather_facts: false
  tasks:
    - name: Run nxos_vlans merged with nve_overlay
      register: result
      cisco.nxos.nxos_vlans: &nve_merged
        config:
          - vlan_id: 3801
            nve_overlay: true
          - vlan_id: 3802
            nve_overlay: true
          - vlan_id: 3803
            nve_overlay: false
        state: merged
    - name: Assert nve_overlay is set after the vlan and reset with the no form
      ansible.builtin.assert:
        that:
          - result.changed == true
          - result.commands == expected
      vars:
        expected:
          - system vlan nve-overlay id 3801
          - vlan 3802
          - system vlan nve-overlay id 3802
          - no system vlan nve-overlay id 3803
    - name: Idempotent re-run (merged nve_overlay)
      register: idempotent_result
      cisco.nxos.nxos_vlans: *nve_merged
    - name: Assert idempotent (merged nve_overlay)
      ansible.builtin.assert:
        that:
          - idempotent_result.changed == false
          - idempotent_result.commands | length == 0

