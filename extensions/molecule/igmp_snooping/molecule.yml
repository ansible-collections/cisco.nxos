driver:
  name: default
platforms:
  - name: cisshgo-igmp_snooping-gathered
  - name: cisshgo-igmp_snooping-merged
  - name: cisshgo-igmp_snooping-replaced
  - name: cisshgo-igmp_snooping-overridden
  - name: cisshgo-igmp_snooping-deleted
  - name: cisshgo-igmp_snooping-deleted_all
  - name: cisshgo-igmp_snooping-options
provisioner:
  name: ansible
  inventory:
    links:
      hosts: ../cisshgo_fixtures/inventories/ansible/igmp_snooping.yaml
  env:
    ANSIBLE_FORCE_COLOR: "true"
    ANSIBLE_HOST_KEY_CHECKING: "false"
    ANSIBLE_DEPRECATION_WARNINGS: "false"
  playbooks:
    create: ../_shared/create.yml
    converge: converge.yml
    verify: ../_shared/verify.yml
    destroy: ../_shared/destroy.yml
scenario:
  test_sequence:
    - create
    - converge
    - verify
    - destroy
prerun: false
verifier:
  name: ansible
