- name: "Nxos_igmp_snooping — state: deleted (listed configuration)"
  hosts: nxos_igmp_snooping_deleted
  gather_facts: false
  vars_files:
    - ../../../tests/integration/targets/nxos_igmp_snooping/vars/main.yml
  tasks:
    - name: Run nxos_igmp_snooping deleted
      register: result
      cisco.nxos.nxos_igmp_snooping: &deleted
        config:
          group_timeout: "300"
          vlans:
            - vlan_id: 100
              static_groups:
                - group: 233.252.0.11
                  source: 192.0.2.10
                  interfaces:
                    - Po20
            - vlan_id: 200
        state: deleted
    - name: Assert deleted result
      ansible.builtin.assert:
