    - name: Idempotent re-run (deleted)
      register: idempotent_result
      cisco.nxos.nxos_igmp_snooping: *deleted_all
    - name: Assert idempotent (deleted)
      ansible.builtin.assert:
        that:
          - idempotent_result.changed == false
          - idempotent_result.commands | length == 0
