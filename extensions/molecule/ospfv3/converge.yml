- name: "Nxos_ospfv3 — state: gathered"
  hosts: nxos_ospfv3_gathered
  gather_facts: false
  vars_files:
    - ../../../tests/integration/targets/nxos_ospfv3/vars/main.yml
  tasks:
    - name: Gather nxos_ospfv3 facts
      register: result
      cisco.nxos.nxos_ospfv3:
        state: gathered
    - name: Assert gathered
      ansible.builtin.assert:
        that:
          - result.changed == false
          - merged.after.processes | symmetric_difference(result.gathered.processes) | length == 0

- name: "Nxos_ospfv3 — state: merged"
  hosts: nxos_ospfv3_merged
  gather_facts: false
  vars_files:
    - ../../../tests/integration/targets/nxos_ospfv3/vars/main.yml
  tasks:
    - name: Run nxos_ospfv3 merged
      register: result
      cisco.nxos.nxos_ospfv3:
        config:
          processes:
            - process_id: 100
              router_id: 203.0.113.20
            - address_family:
                afi: ipv6
                areas:
                  - area_id: 0.0.0.100
                    filter_list:
                      - direction: in
                        route_map: rmap_1
                      - direction: out
                        route_map: rmap_2
                    ranges:
                      - not_advertise: true
                        prefix: 2001:db2::/32
                      - cost: 120
                        prefix: 2001:db3::/32
                redistribute:
                  - id: 120
                    protocol: eigrp
                    route_map: rmap_1
                  - protocol: direct
                    route_map: ospf102-direct-connect
                safi: unicast
              process_id: 102
              router_id: 198.51.100.1
              vrfs:
                - areas:
                    - area_id: 0.0.0.102
                      nssa:
                        default_information_originate: true
                        no_summary: true
                    - area_id: 0.0.0.103
                      nssa:
                        no_summary: true
                        translate:
                          type7:
                            always: true
                  router_id: 198.51.100.129
                  vrf: zone1
                - auto_cost:
                    reference_bandwidth: 45
                    unit: Gbps
                  vrf: zone2
        state: merged
    - name: Assert commands
      ansible.builtin.assert:
        that:
          - result.commands | symmetric_difference(merged.commands) | length == 0
