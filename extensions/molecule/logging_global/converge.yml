- name: "Nxos_logging_global — state: gathered"
  hosts: nxos_logging_global_gathered
  gather_facts: false
  vars_files:
    - ../../../tests/integration/targets/nxos_logging_global/vars/main.yml
  tasks:
    - name: Gather nxos_logging_global facts
      register: result
      cisco.nxos.nxos_logging_global:
        state: gathered
    - name: Assert gathered
      ansible.builtin.assert:
        that:
          - result.changed == false
          - result.gathered | ansible.utils.remove_keys(target=['use_vrf']) == gathered.config

- name: "Nxos_logging_global — state: merged"
  hosts: nxos_logging_global_merged
  gather_facts: false
  vars_files:
    - ../../../tests/integration/targets/nxos_logging_global/vars/main.yml
  tasks:
    - name: Run nxos_logging_global merged
      register: result
      cisco.nxos.nxos_logging_global:
        config:
          console:
            severity: error
          facilities:
            - facility: auth
              severity: critical
            - facility: aaa
              severity: alert
            - facility: ftp
              severity: informational
          hosts:
            - host: 203.0.113.100
              severity: alert
              use_vrf: management
            - facility: local6
              host: 203.0.113.101
              severity: error
          ip:
            access_list:
              cache:
                entries: 16384
                interval: 200
                threshold: 5000
          monitor:
            severity: warning
          origin_id:
            hostname: true
        state: merged
    - name: Assert commands
      ansible.builtin.assert:
        that:
          - result.commands | symmetric_difference(merged.commands) | length == 0
