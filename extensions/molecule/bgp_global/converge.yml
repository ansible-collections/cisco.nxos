---
- name: "Nxos_bgp_global -- state: gathered"
  hosts: nxos_bgp_global_gathered
  gather_facts: false
  vars_files:
    - "{{ playbook_dir }}/../../../tests/integration/targets/nxos_bgp_global/vars/main.yml"
  tasks:
    - name: Gather BGP facts
      register: result
      cisco.nxos.nxos_bgp_global:
        state: gathered

    - name: Assert gathered matches populated config
      ansible.builtin.assert:
        that:
          - merged.after == result.gathered
          - result.changed == false

- name: "Nxos_bgp_global -- state: merged"
  hosts: nxos_bgp_global_merged
  gather_facts: false
  vars_files:
    - "{{ playbook_dir }}/../../../tests/integration/targets/nxos_bgp_global/vars/main.yml"
  tasks:
    - name: Apply merged config
      register: result
      cisco.nxos.nxos_bgp_global: &merged_config
        config:
          as_number: 65536
          router_id: 198.51.100.2
          bestpath:
            as_path:
              multipath_relax: true
            compare_neighborid: true
            cost_community_ignore: true
          confederation:
            identifier: 42
            peers:
              - 65020
              - 65030
              - 65040
          log_neighbor_changes: true
          maxas_limit: 20
          neighbors:
            - neighbor_address: 198.51.100.20
              neighbor_affinity_group:
                group_id: 160
              remote_as: 65537
              description: NBR-1
              low_memory:
                exempt: true
            - neighbor_address: 198.51.100.21
              remote_as: 65537
          neighbor_down:
            fib_accelerate: true
          vrfs:
            - vrf: site-1
              local_as: 200
              log_neighbor_changes: true
              neighbors:
                - neighbor_address: 192.0.2.10
                  description: site-1-nbr-1
                  remote_as: 65538
                - neighbor_address: 192.0.2.11
                  remote_as: 65538
                  description: site-1-nbr-2
            - vrf: site-2
              local_as: 300
              log_neighbor_changes: true
              neighbors:
                - neighbor_address: 203.0.113.2
                  description: site-2-nbr-1
                  remote_as: 65539
              neighbor_down:
                fib_accelerate: true
        state: merged

    - name: Assert merged commands
      ansible.builtin.assert:
        that:
          - result.changed == true
          - result.commands | symmetric_difference(merged.commands) | length == 0

    - name: Assert merged after state
      ansible.builtin.assert:
        that:
          - merged.after == result.after

    - name: Idempotence - merged
      register: result
      cisco.nxos.nxos_bgp_global: *merged_config

    - name: Assert idempotent (merged)
      ansible.builtin.assert:
        that:
          - result.changed == false
          - result.commands | length == 0

    - name: Empty config with state merged should fail
      register: result_empty_config
      ignore_errors: true
      cisco.nxos.nxos_bgp_global:
        config: {}
        state: merged

    - name: Assert empty config error for merged
      ansible.builtin.assert:
        that:
          - result_empty_config.failed == true
          - "'value of config parameter must not be empty for state merged' in result_empty_config.msg"

