---
# Mirrors tests/integration/targets/nxos_hsrp_interfaces/tests/common/*.yaml
# Primary module invocation per state (not preempt sub-tests in merged/replaced).

- name: "Nxos_hsrp_interfaces — state: merged"
  hosts: nxos_hsrp_interfaces_merged
  gather_facts: false
  vars_files:
    - ../../../tests/integration/targets/nxos_hsrp_interfaces/vars/main.yml
  vars:
    test_int1: Ethernet1/1
    test_int2: Ethernet1/2
    platform: N9K
    bfd_enable: enable
    bfd_disable: disable
  tasks:
    - name: Run nxos_hsrp_interfaces merged
      register: result
      cisco.nxos.nxos_hsrp_interfaces: &merged_config
        config:
          - name: "{{ test_int1 }}"
            standby:
              bfd: true
              mac_refresh: 400
              version: 2
            standby_options:
              - group_name: VLAN10-GROUP
                group_no: 10
                ip:
                  - secondary: true
                    virtual_ip: 10.10.10.2
                mac_address: 00CC.10DD.10EE
        state: merged
    - name: Assert commands
      ansible.builtin.assert:
        that:
          - result.changed == true
          - merged.commands | symmetric_difference(result.commands) | length == 0
    - name: Gather hsrp_interfaces facts
      cisco.nxos.nxos_facts:
        gather_subset:
          - "!all"
          - "!min"
        gather_network_resources: hsrp_interfaces
    - name: Idempotent re-run (merged)
      register: idempotent_result
      cisco.nxos.nxos_hsrp_interfaces: *merged_config
    - name: Assert idempotent (no changes)
      ansible.builtin.assert:
        that:
          - idempotent_result.changed == false
          - idempotent_result.commands | length == 0

