- name: "Nxos_bgp_address_family — state: gathered"
  hosts: nxos_bgp_address_family_gathered
  gather_facts: false
  vars_files:
    - "{{ playbook_dir }}/../../../tests/integration/targets/nxos_bgp_address_family/vars/main.yml"
  tasks:
    - name: Gather nxos_bgp_address_family facts
      register: result
      cisco.nxos.nxos_bgp_address_family:
        state: gathered
    - name: Assert gathered
      ansible.builtin.assert:
        that:
          - result.changed == false
          - merged.after.address_family | symmetric_difference(result.gathered.address_family) | length == 0
          - merged.after.as_number == result.gathered.as_number

- name: "Nxos_bgp_address_family — state: merged"
  hosts: nxos_bgp_address_family_merged
  gather_facts: false
  vars_files:
    - "{{ playbook_dir }}/../../../tests/integration/targets/nxos_bgp_address_family/vars/main.yml"
  tasks:
    - name: Run nxos_bgp_address_family merged
      register: result
      cisco.nxos.nxos_bgp_address_family:
        config:
          address_family:
            - afi: ipv4
              networks:
                - prefix: 192.0.2.32/27
                - prefix: 192.0.2.64/27
                  route_map: rmap1
              nexthop:
                route_map: rmap2
                trigger_delay:
                  critical_delay: 120
                  non_critical_delay: 180
              safi: multicast
            - afi: ipv4
              aggregate_address:
                - as_set: true
                  prefix: 203.0.113.0/24
                  summary_only: true
              default_information:
                originate: true
              safi: unicast
              vrf: site-1
            - afi: ipv6
              redistribute:
                - id: 100
                  protocol: ospfv3
                  route_map: rmap-ospf-1
                - id: 101
                  protocol: eigrp
                  route_map: rmap-eigrp-1
              safi: multicast
              vrf: site-1
          as_number: 65536
        state: merged
    - name: Assert commands
      ansible.builtin.assert:
        that:
          - result.commands | symmetric_difference(merged.commands) | length == 0
    - name: Idempotent re-run (merged)
