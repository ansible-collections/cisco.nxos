              neighbor_address: 192.0.2.32
            - address_family:
                - afi: ipv4
                  inherit:
                    sequence: 200
                    template: BasePolicy
                  safi: multicast
              neighbor_address: 192.0.2.33
          vrfs:
            - neighbors:
                - address_family:
                    - afi: ipv4
                      next_hop_self:
                        set: true
                      safi: unicast
                      suppress_inactive: true
                  neighbor_address: 203.0.113.1
                - address_family:
                    - afi: ipv6
                      safi: unicast
                    - afi: ipv4
                      safi: multicast
                      send_community:
                        set: true
                  neighbor_address: 203.0.113.2
