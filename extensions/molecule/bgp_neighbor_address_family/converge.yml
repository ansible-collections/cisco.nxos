---
# AUTO-GENERATED — rename to converge.yml after review.
# Manual review needed only for complex idempotent edge cases or custom assertions.

- name: "Nxos_bgp_neighbor_address_family — state: gathered"
  hosts: nxos_bgp_neighbor_address_family_gathered
  gather_facts: false
  vars_files:
    - "{{ playbook_dir }}/../../../tests/integration/targets/nxos_bgp_neighbor_address_family/vars/main.yml"
  tasks:
    - name: Gather nxos_bgp_neighbor_address_family facts
      register: result
      cisco.nxos.nxos_bgp_neighbor_address_family:
        state: gathered
    - name: Assert gathered
      ansible.builtin.assert:
        that:
          - result.changed == false
          - merged.after.neighbors | symmetric_difference(result.gathered.neighbors) | length == 0
          - merged.after.vrfs | symmetric_difference(result.gathered.vrfs) | length == 0
          - merged.after.as_number == result.gathered.as_number

- name: "Nxos_bgp_neighbor_address_family — state: merged"
  hosts: nxos_bgp_neighbor_address_family_merged
  gather_facts: false
  vars_files:
    - "{{ playbook_dir }}/../../../tests/integration/targets/nxos_bgp_neighbor_address_family/vars/main.yml"
  tasks:
    - name: Run nxos_bgp_neighbor_address_family merged
      register: result
      cisco.nxos.nxos_bgp_neighbor_address_family:
        config:
          as_number: 65536
          neighbors:
            - address_family:
                - afi: ipv4
                  maximum_prefix:
                    generate_warning_threshold: 75
                    max_prefix_limit: 20
                  prefix_list:
                    inbound: rmap1
                    outbound: rmap2
                  safi: unicast
                  weight: 100
                - afi: ipv6
                  safi: unicast
              neighbor_address: 192.0.2.32
            - address_family:
                - afi: ipv4
                  inherit:
                    sequence: 200
                    template: BasePolicy
                  safi: multicast
              neighbor_address: 192.0.2.33
          vrfs:
            - neighbors:
                - address_family:
                    - afi: ipv4
                      next_hop_self:
                        set: true
                      safi: unicast
                      suppress_inactive: true
                  neighbor_address: 203.0.113.1
                - address_family:
                    - afi: ipv6
                      safi: unicast
                    - afi: ipv4
                      safi: multicast
                      send_community:
                        set: true
                  neighbor_address: 203.0.113.2
              vrf: site-1
        state: merged
    - name: Assert commands
      ansible.builtin.assert:
        that:
          - result.commands | symmetric_difference(merged.commands) | length == 0
    - name: Idempotent re-run (merged)
      register: idempotent_result
      cisco.nxos.nxos_bgp_neighbor_address_family:
        config:
          as_number: 65536
          neighbors:
            - address_family:
                - afi: ipv4
                  maximum_prefix:
                    generate_warning_threshold: 75
                    max_prefix_limit: 20
                  prefix_list:
                    inbound: rmap1
