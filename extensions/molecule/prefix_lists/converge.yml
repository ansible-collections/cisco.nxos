- name: "Nxos_prefix_lists — state: gathered"
  hosts: nxos_prefix_lists_gathered
  gather_facts: false
  vars_files:
    - ../../../tests/integration/targets/nxos_prefix_lists/vars/main.yml
  tasks:
    - name: Gather nxos_prefix_lists facts
      register: result
      cisco.nxos.nxos_prefix_lists:
        state: gathered
    - name: Assert gathered
      ansible.builtin.assert:
        that:
          - result.changed == false
          - result.gathered[0] == merged.after[0]
          - result.gathered[1] == merged.after[1]

- name: "Nxos_prefix_lists — state: merged"
  hosts: nxos_prefix_lists_merged
  gather_facts: false
  vars_files:
    - ../../../tests/integration/targets/nxos_prefix_lists/vars/main.yml
  tasks:
    - name: Run nxos_prefix_lists merged
      register: result
      cisco.nxos.nxos_prefix_lists:
        config:
          - afi: ipv4
            prefix_lists:
              - description: allows engineering IPv4 networks
                entries:
                  - action: permit
                    eq: 24
                    prefix: 192.0.2.0/23
                    sequence: 10
                  - action: permit
                    prefix: 198.51.100.128/26
                    sequence: 20
                name: AllowPrefix
              - description: denies lab IPv4 networks
                entries:
                  - action: deny
                    le: 25
                    prefix: 203.0.113.0/24
                    sequence: 20
                name: DenyPrefix
          - afi: ipv6
            prefix_lists:
              - description: allows engineering IPv6 networks
                entries:
                  - action: permit
                    prefix: 2001:db8:400::/38
                    sequence: 8
                  - action: permit
                    le: 37
                    prefix: 2001:db8:8000::/35
                    sequence: 20
                name: AllowIPv6Prefix
        state: merged
    - name: Assert commands
      ansible.builtin.assert:
        that:
          - result.commands | symmetric_difference(merged.commands) | length == 0
    - name: Idempotent re-run (merged)
      register: idempotent_result
      cisco.nxos.nxos_prefix_lists:
        config:
          - afi: ipv4
            prefix_lists:
              - description: allows engineering IPv4 networks
                entries:
                  - action: permit
                    eq: 24
                    prefix: 192.0.2.0/23
                    sequence: 10
                  - action: permit
                    prefix: 198.51.100.128/26
                    sequence: 20
                name: AllowPrefix
              - description: denies lab IPv4 networks
                entries:
                  - action: deny
                    le: 25
                    prefix: 203.0.113.0/24
                    sequence: 20
                name: DenyPrefix
          - afi: ipv6
            prefix_lists:
              - description: allows engineering IPv6 networks
                entries:
                  - action: permit
                    prefix: 2001:db8:400::/38
                    sequence: 8
                  - action: permit
                    le: 37
                    prefix: 2001:db8:8000::/35
                    sequence: 20
                name: AllowIPv6Prefix
        state: merged
    - name: Assert idempotent (no changes)
      ansible.builtin.assert:
        that:
          - idempotent_result.changed == false
          - idempotent_result.commands | length == 0

