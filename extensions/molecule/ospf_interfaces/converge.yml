---
# AUTO-GENERATED — rename to converge.yml after review.
# Manual review needed only for complex idempotent edge cases or custom assertions.

- name: "Nxos_ospf_interfaces — state: gathered"
  hosts: nxos_ospf_interfaces_gathered
  gather_facts: false
  vars:
    nxos_int1: Ethernet1/1
    nxos_int2: Ethernet1/2
    nxos_int3: Ethernet1/3
  vars_files:
    - ../../../tests/integration/targets/nxos_ospf_interfaces/vars/main.yml
  tasks:
    - name: Gather nxos_ospf_interfaces facts
      register: result
      cisco.nxos.nxos_ospf_interfaces:
        state: gathered
    - name: Assert gathered
      ansible.builtin.assert:
        that:
          - result.changed == false
          - result.gathered[0] == merged.after[0]
          - result.gathered[1] == merged.after[1]
          - result.gathered[2] == merged.after[2]

- name: "Nxos_ospf_interfaces — state: merged"
  hosts: nxos_ospf_interfaces_merged
  gather_facts: false
  vars:
    nxos_int1: Ethernet1/1
    nxos_int2: Ethernet1/2
    nxos_int3: Ethernet1/3
  vars_files:
    - ../../../tests/integration/targets/nxos_ospf_interfaces/vars/main.yml
  tasks:
    - name: Run nxos_ospf_interfaces merged
      register: result
      cisco.nxos.nxos_ospf_interfaces:
        config:
          - address_family:
              - afi: ipv4
                multi_areas:
                  - 11.11.11.11
                processes:
                  - area:
                      area_id: 1.1.1.1
                      secondaries: false
                    process_id: "100"
              - afi: ipv6
                multi_areas:
                  - 21.0.0.0
                  - 50.50.50.50
                  - 16.10.10.10
                processes:
                  - area:
                      area_id: 2.2.2.2
                    process_id: "200"
            name: "{{ nxos_int1 }}"
          - address_family:
              - afi: ipv4
                authentication:
                  enable: true
                  key_chain: test-1
                cost: 100
              - afi: ipv6
                network: broadcast
                shutdown: true
            name: "{{ nxos_int2 }}"
          - address_family:
              - afi: ipv4
                cost: 101
            name: "{{ nxos_int3 }}"
        state: merged
    - name: Assert commands
      ansible.builtin.assert:
        that:
          - result.commands | symmetric_difference(merged.commands) | length == 0
    - name: Idempotent re-run (merged)
      register: idempotent_result
      cisco.nxos.nxos_ospf_interfaces:
        config:
          - address_family:
              - afi: ipv4
                multi_areas:
                  - 11.11.11.11
                processes:
                  - area:
                      area_id: 1.1.1.1
                      secondaries: false
                    process_id: "100"
              - afi: ipv6
                multi_areas:
                  - 21.0.0.0
                  - 50.50.50.50
                  - 16.10.10.10
                processes:
                  - area:
                      area_id: 2.2.2.2
                    process_id: "200"
            name: "{{ nxos_int1 }}"
          - address_family:
              - afi: ipv4
                authentication:
                  enable: true
                  key_chain: test-1
                cost: 100
              - afi: ipv6
                network: broadcast
                shutdown: true
            name: "{{ nxos_int2 }}"
          - address_family:
              - afi: ipv4
                cost: 101
            name: "{{ nxos_int3 }}"
        state: merged
    - name: Assert idempotent (no changes)
      ansible.builtin.assert:
        that:
          - idempotent_result.changed == false
          - idempotent_result.commands | length == 0

