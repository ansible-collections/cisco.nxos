---
# Mirrors tests/integration/targets/nxos_bfd_interfaces/tests/common/*.yaml

- name: "Nxos_bfd_interfaces — state: gathered"
  hosts: nxos_bfd_interfaces_gathered
  gather_facts: false
  vars_files:
    - ../../../tests/integration/targets/nxos_bfd_interfaces/vars/main.yml
  tasks:
    - name: Gather nxos_bfd_interfaces facts
      register: result
      cisco.nxos.nxos_bfd_interfaces:
        state: gathered
    - name: Assert gathered
      ansible.builtin.assert:
        that:
          - result.changed == false
          - >
            {{
              result['gathered']
              | selectattr('name', 'in', 'Ethernet1/1,Ethernet1/2')
              | symmetric_difference(gathered)
              | length == 0
            }}
    - name: Idempotent re-run (gathered)
      register: idempotent_result
      cisco.nxos.nxos_bfd_interfaces:
        state: gathered
    - name: Assert idempotent (no changes)
      ansible.builtin.assert:
        that:
          - idempotent_result.changed == false

- name: "Nxos_bfd_interfaces — state: merged"
  hosts: nxos_bfd_interfaces_merged
  gather_facts: false
  vars:
    test_int1: Ethernet1/1
    platform: N9K
    bfd_enable: enable
    bfd_disable: disable
  tasks:
    - name: Run nxos_bfd_interfaces merged
      register: result
      cisco.nxos.nxos_bfd_interfaces: &merged_config
        config:
          - name: "{{ test_int1 }}"
            bfd: "{{ bfd_disable }}"
            echo: disable
        state: merged
    - name: Assert commands (no bfd echo)
      ansible.builtin.assert:
        that:
          - result.changed == true
          - "'no bfd echo' in result.commands"
    - name: Assert commands (no bfd)
      ansible.builtin.assert:
        that:
          - "'no bfd' in result.commands"
    - name: Gather bfd_interfaces facts
      cisco.nxos.nxos_facts:
        gather_subset:
          - "!all"
          - "!min"
        gather_network_resources: bfd_interfaces
    - name: Idempotent re-run (merged)
      register: idempotent_result
      cisco.nxos.nxos_bfd_interfaces: *merged_config
    - name: Assert idempotent (no changes)
      ansible.builtin.assert:
        that:
          - idempotent_result.changed == false
          - idempotent_result.commands | length == 0

