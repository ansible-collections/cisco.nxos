- name: "Nxos_bfd_interfaces — state: overridden"
  hosts: nxos_bfd_interfaces_overridden
  gather_facts: false
  vars:
    test_int1: Ethernet1/1
    test_int2: Ethernet1/2
    platform: N9K
    bfd_enable: enable
    bfd_disable: disable
  tasks:
    - name: Run nxos_bfd_interfaces overridden
      register: result
      cisco.nxos.nxos_bfd_interfaces: &overridden_config
        config:
          - name: "{{ test_int1 }}"
            bfd: "{{ bfd_disable }}"
            echo: disable
        state: overridden
    - name: Assert commands
      ansible.builtin.assert:
        that:
          - result.changed == true
          - result.commands[1] == 'bfd echo'
          - result.commands[3] == 'no bfd echo'
    - name: Idempotent re-run (overridden)
      register: idempotent_result
      cisco.nxos.nxos_bfd_interfaces: *overridden_config
    - name: Assert idempotent (no changes)
      ansible.builtin.assert:
        that:
          - idempotent_result.changed == false
          - idempotent_result.commands | length == 0

- name: "Nxos_bfd_interfaces — state: deleted"
  hosts: nxos_bfd_interfaces_deleted
  gather_facts: false
  vars:
    test_int1: Ethernet1/1
    platform: N9K
    bfd_enable: enable
    bfd_disable: disable
  tasks:
    - name: Deleted
      register: result
      cisco.nxos.nxos_bfd_interfaces: &deleted_config
        config:
          - name: "{{ test_int1 }}"
        state: deleted
    - name: Assert commands (bfd echo)
      ansible.builtin.assert:
        that:
          - result.changed == true
          - "'bfd echo' in result.commands"
    - name: Assert commands (bfd)
      ansible.builtin.assert:
        that:
          - "'bfd' in result.commands"
    - name: Idempotent re-run (deleted)
      register: idempotent_result
      cisco.nxos.nxos_bfd_interfaces: *deleted_config
    - name: Assert idempotent (no changes)
      ansible.builtin.assert:
        that:
          - idempotent_result.changed == false
          - idempotent_result.commands | length == 0

- name: Parsed state (offline)
  hosts: nxos_bfd_interfaces_gathered
  gather_facts: false
  vars_files:
    - ../../../tests/integration/targets/nxos_bfd_interfaces/vars/main.yml
  tasks:
    - name: Run nxos_bfd_interfaces parsed
      register: result
      cisco.nxos.nxos_bfd_interfaces: &parsed_config
        running_config: |
          feature bfd
          interface Ethernet1/800
            no switchport
            no bfd
            no bfd echo
          interface Ethernet1/801
            no switchport
            no bfd
          interface Ethernet1/802
            no switchport
            no bfd echo
          interface mgmt0
            ip address dhcp
            vrf member management
        state: parsed
    - name: Assert parsed result
      ansible.builtin.assert:
        that:
          - parsed | symmetric_difference(result['parsed']) | length == 0
    - name: Idempotent re-run (parsed)
      register: idempotent_result
      cisco.nxos.nxos_bfd_interfaces: *parsed_config
    - name: Assert idempotent (no changes)
      ansible.builtin.assert:
        that:
          - idempotent_result.changed == false

- name: Rendered state (offline)
  hosts: nxos_bfd_interfaces_gathered
  gather_facts: false
  vars_files:
    - ../../../tests/integration/targets/nxos_bfd_interfaces/vars/main.yml
  tasks:
    - name: Run nxos_bfd_interfaces rendered
      register: result
      cisco.nxos.nxos_bfd_interfaces: &rendered_config
        config:
          - name: Ethernet1/800
            bfd: enable
            echo: enable
          - name: Ethernet1/801
            bfd: disable
            echo: disable
        state: rendered
    - name: Assert rendered commands
      ansible.builtin.assert:
        that:
          - rendered | symmetric_difference(result['rendered']) | length == 0
    - name: Idempotent re-run (rendered)
      register: idempotent_result
      cisco.nxos.nxos_bfd_interfaces: *rendered_config
    - name: Assert idempotent (no changes)
      ansible.builtin.assert:
        that:
          - idempotent_result.changed == false
