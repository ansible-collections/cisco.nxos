- name: "Nxos_route_maps — match_metric_deviation"
  hosts: nxos_route_maps_match_metric_deviation
  gather_facts: false
  vars_files:
    - ../../../tests/integration/targets/nxos_route_maps/vars/main.yml
  tasks:
    - name: Merge match metric deviation via resource module
      register: result
      cisco.nxos.nxos_route_maps:
        config:
          - route_map: rmap_metric_dev
            entries:
              - sequence: 10
                action: permit
                match:
                  metric:
                    - value: 0
                      deviation: 100
                    - value: 100
                      deviation: 65000
        state: merged
    - name: Assert merge generated expected match metric command
      ansible.builtin.assert:
        that:
          - result is changed
          - "'match metric 0 +- 100 100 +- 65000' in result.commands"
    - name: Merge match metric deviation again (idempotent)
      register: idempotent_result
      cisco.nxos.nxos_route_maps:
        config:
          - route_map: rmap_metric_dev
            entries:
              - sequence: 10
                action: permit
                match:
                  metric:
                    - value: 0
                      deviation: 100
                    - value: 100
                      deviation: 65000
        state: merged
    - name: Assert merge is idempotent
      ansible.builtin.assert:
        that:
          - idempotent_result is not changed
          - idempotent_result.commands | length == 0

