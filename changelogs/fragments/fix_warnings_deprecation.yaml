---
minor_changes:
  - All legacy modules - add ``emit_warnings()`` call from
    ``ansible_collections.ansible.netcommon.plugins.module_utils.network.common.utils``
    before ``module.exit_json()`` to pop and emit the ``warnings`` key via ``module.warn()``,
    suppressing the deprecation warning raised by ansible-core 2.23+.
  - All legacy modules that already imported from
    ``ansible_collections.ansible.netcommon.plugins.module_utils.network.common.utils`` -
    extend the existing import block to include ``emit_warnings``.
  - The following files - ``plugins/cliconf/nxos.py``, ``plugins/httpapi/nxos.py``,
    ``plugins/module_utils/network/nxos/nxos.py``,
    ``plugins/module_utils/network/nxos/facts/snmp_server/snmp_server.py`` -
    replace deprecated ``ansible.module_utils._text`` and
    ``ansible.module_utils.common._collections_compat`` imports with their
    modern equivalents (``ansible.module_utils.common.text.converters`` and
    ``collections.abc``).
  - Add significant number of testcases across multiple modules that were not
    covered due to which sonar coverage failures were being caused
