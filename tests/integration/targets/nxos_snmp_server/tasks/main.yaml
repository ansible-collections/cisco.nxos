---
- name: Get admin user SNMP data
  cisco.nxos.nxos_command:
    commands: show running | section '^snmp-server user'
  register: res

- name: Grep admin user SNMP localized key
  ansible.builtin.set_fact:
    # noqa jinja[spacing]
    admin_snmp_passwd:
      "{{ res['stdout'][0] | regex_search('snmp-server user admin network-admin auth
      (md5|sha|sha-256) (\\S+)', '\\2') }}"

- name: Grep admin SNMP localized privacy key
  ansible.builtin.set_fact:
    admin_snmp_priv_key:
      "{{ res['stdout'][0] | regex_search('snmp-server user admin network-admin auth
      (?:md5|sha|sha-256) \\S+ priv aes-128 (\\S+) localizedV2key', '\\1') }}"

- name: Find admin user SNMP localized key
  ansible.builtin.set_fact:
    admin_snmp_passwd: "{{ admin_snmp_passwd[0] }}"

- name: Find admin user localized privacy key
  ansible.builtin.set_fact:
    admin_snmp_priv_key: "{{ admin_snmp_priv_key[0] }}"

