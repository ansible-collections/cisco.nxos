---
# NX-OS rejects `no snmp-server user admin`. network_cli continues after that
# CLI error; NX-API fails the whole edit. Restore the pre-test gathered config
# with overridden instead of state=deleted.
#
# NX-API also fails a single edit when two host-delete commands target the same
# IP: `no snmp-server host X traps ...` removes the whole host, then
# `no snmp-server host X source-interface ...` returns "No such SNMP target".
# Apply NX-API restore commands one at a time so that error is not fatal.
- name: Restore baseline snmp-server configuration
  when: ansible_connection != "ansible.netcommon.httpapi"
  cisco.nxos.nxos_snmp_server:
    config: "{{ snmp_baseline_config }}"
    state: overridden

- name: Compute commands to restore baseline
  when: ansible_connection == "ansible.netcommon.httpapi"
  cisco.nxos.nxos_snmp_server:
    config: "{{ snmp_baseline_config }}"
    state: overridden
  check_mode: true
  register: snmp_restore

- name: Apply restore commands individually
  when: ansible_connection == "ansible.netcommon.httpapi"
  cisco.nxos.nxos_config:
    lines:
      - "{{ restore_cmd }}"
    match: none
  loop: "{{ (snmp_restore.commands | default([])) | map('split', newline) | flatten | map('trim') | reject('equalto', '') | list }}"
  loop_control:
    loop_var: restore_cmd
  vars:
    newline: "\n"
  failed_when: >-
    failed | default(false)
    and ('No such SNMP target' not in (msg | default('') | string))
    and ('cannot be deactivated' not in (msg | default('') | string))
