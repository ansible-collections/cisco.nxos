---
- ansible.builtin.debug:
    msg: Start nxos_snmp_server deleted integration tests connection={{ ansible_connection }}

- ansible.builtin.include_tasks: _remove_config.yaml

- ansible.builtin.include_tasks: _populate_config.yaml

- block:
    # NX-API fails the whole edit if any line errors (login user cannot be
    # deactivated). Use check_mode for command generation, then apply lines
    # individually. network_cli runs deleted against the device directly.
    - name: Delete snmp-server configuration
      cisco.nxos.nxos_snmp_server: &del
        state: deleted
      register: result
      check_mode: "{{ ansible_connection == 'ansible.netcommon.httpapi' }}"

    - name: Apply deleted commands individually
      when: ansible_connection == "ansible.netcommon.httpapi"
      cisco.nxos.nxos_config:
        lines:
          - "{{ delete_cmd }}"
        match: none
      loop: "{{ (result.commands | default([])) | map('split', newline) | flatten | map('trim') | reject('equalto', '') | list }}"
      loop_control:
        loop_var: delete_cmd
      vars:
        newline: "\n"
      failed_when: >-
        failed | default(false)
        and ('No such SNMP target' not in (msg | default('') | string))
        and ('cannot be deactivated' not in (msg | default('') | string))

    - name: Assert that correct set of commands were generated
      ansible.builtin.assert:
        that:
          # Extra baseline deletes (engineID, protocol, ...) vary by image.
          # Login SNMP users are excluded; NX-OS will not deactivate them.
          - >
            {{
              deleted['commands']
              | difference(
                  result['commands']
                  | reject('search', 'snmp-server user')
                  | list
                )
              | length == 0
            }}

    - name: Gather snmp-server facts after delete
      when: ansible_connection == "ansible.netcommon.httpapi"
      cisco.nxos.nxos_snmp_server:
        state: gathered
      register: snmp_after_delete

    - name: Assert that test-owned snmp-server config was removed
      ansible.builtin.assert:
        that:
          - after_state.contact is not defined
          - after_state.location is not defined
          - after_state.communities | default([]) | length == 0
          - after_state.hosts | default([]) | length == 0
      vars:
        after_state: "{{ snmp_after_delete.gathered | default(result.after) }}"

    - name: Delete snmp-server configuration (idempotent)
      cisco.nxos.nxos_snmp_server: *del
      register: result
      check_mode: "{{ ansible_connection == 'ansible.netcommon.httpapi' }}"

    - name: Assert that removable snmp-server config is unchanged
      ansible.builtin.assert:
        that:
          # Login SNMP users remain, so changed may still be true.
          - >
            {{
              result['commands']
              | reject('search', 'snmp-server user')
              | list
              | length == 0
            }}

  always:
    - ansible.builtin.include_tasks: _remove_config.yaml
