---
- ansible.builtin.debug:
    msg: "Start nxos_snmp_server replaced integration tests connection={{ ansible_connection }}"

- ansible.builtin.include_tasks: _remove_config.yaml

- ansible.builtin.include_tasks: _populate_config.yaml

- block:
    - name: Replace snmp-server configurations of listed snmp-server with provided configurations
      cisco.nxos.nxos_snmp_server: &id001
        config:
          aaa_user:
            cache_timeout: 36000
          communities:
            - name: public
              group: network-operator
            - name: secret
              group: network-operator
          contact: nxosswitchadmin2@localhost
          location: serverroom-2
          traps:
            aaa:
              server_state_change: true
          hosts:
            - host: 192.0.2.1
              traps: true
              version: "1"
              community: public
            - host: 192.0.2.1
              source_interface: Ethernet1/1
            - host: 192.0.3.2
              informs: true
              version: "3"
              auth: NMS
          # Keep device baseline users (admin/cisco locally, ansible on CML)
          # so replaced does not send `no snmp-server user <login>`.
          users: "{{ snmp_replaced_users }}"
        state: replaced
      register: result

    # Default SNMP users vary by NX-OS image; compare resource commands only.
    - name: Assert that correct set of commands were generated
      ansible.builtin.assert:
        that:
          - >
            {{
              result['commands']
              | reject('search', 'snmp-server user')
              | list
              | symmetric_difference(replaced['commands'])
              | length == 0
            }}

    - name: Replace snmp-server configurations of listed snmp-server with provided configurations (idempotent)
      register: result
      cisco.nxos.nxos_snmp_server: *id001

    - name: Assert that task was idempotent
      ansible.builtin.assert:
        that:
          - result['changed'] == false
          - result.commands|length == 0

  always:
    - ansible.builtin.include_tasks: _remove_config.yaml
