---
- ansible.builtin.debug:
    msg: START nxos_vpc gathered integration tests on connection={{ ansible_connection }}

- ansible.builtin.include_tasks: _populate_config.yaml

- block:
    - name: Gather VPC domain facts using gathered
      cisco.nxos.nxos_vpc:
        state: gathered
      register: result

    - name: Assert that facts were correctly generated
      ansible.builtin.assert:
        that: result['gathered'] == before

  always:
    - ansible.builtin.include_tasks: _remove_config.yaml

- name: Gather VPC domain facts with no VPC domain configured
  cisco.nxos.nxos_vpc:
    state: gathered
  register: result

- name: Assert that an absent VPC domain gathers as an empty dict
  ansible.builtin.assert:
    that: result['gathered'] == {}
