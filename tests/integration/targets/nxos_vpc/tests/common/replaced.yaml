---
- ansible.builtin.debug:
    msg: START nxos_vpc replaced integration tests on connection={{ ansible_connection }}

- ansible.builtin.include_tasks: _populate_config.yaml

- block:
    - name: Replace device configuration with the provided configuration
      cisco.nxos.nxos_vpc: &id001
        config:
          domain: "100"
          system_priority: "2000"
          pkl_dest: 192.168.100.4
          pkl_src: 10.1.100.20
        state: replaced
      register: result

    - name: Assert that before dict was correctly generated
      ansible.builtin.assert:
        that: result['before'] == before

    - name: Assert that correct set of commands were generated
      ansible.builtin.assert:
        that: replaced['commands'] == result['commands']

    - name: Assert that after dict was correctly generated
      ansible.builtin.assert:
        that: replaced['after'] == result['after']

    - name: Replace device configuration with the provided configuration (idempotent)
      cisco.nxos.nxos_vpc: *id001
      register: result

    - name: Assert that the previous task was idempotent
      ansible.builtin.assert:
        that:
          - result['changed'] == false
          - result.commands|length == 0

  always:
    - ansible.builtin.include_tasks: _remove_config.yaml
