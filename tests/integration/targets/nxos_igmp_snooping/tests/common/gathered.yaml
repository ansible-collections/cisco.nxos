---
- ansible.builtin.debug:
    msg: START nxos_igmp_snooping gathered integration tests on connection={{ ansible_connection }}

- ansible.builtin.include_tasks: _remove_config.yaml

- ansible.builtin.include_tasks: _populate_config.yaml

- block:
    - name: Gather the IGMP snooping configuration
      cisco.nxos.nxos_igmp_snooping:
        state: gathered
      register: result

    - name: Assert that facts were correctly generated
      ansible.builtin.assert:
        that: result['gathered'] == before

    - ansible.builtin.include_tasks: _remove_config.yaml

    - name: Gather the IGMP snooping configuration of a default device
      cisco.nxos.nxos_igmp_snooping:
        state: gathered
      register: result

    - name: Assert that the effective default values are returned
      ansible.builtin.assert:
        that: result['gathered'] == defaults

  always:
    - ansible.builtin.include_tasks: _remove_config.yaml
