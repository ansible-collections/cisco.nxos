---
- ansible.builtin.debug:
    msg: START nxos_igmp_snooping overridden integration tests on connection={{ ansible_connection }}

- ansible.builtin.include_tasks: _remove_config.yaml

- ansible.builtin.include_tasks: _populate_config.yaml

- block:
    - name: Override the IGMP snooping configuration
      cisco.nxos.nxos_igmp_snooping: &id001
        config:
          vxlan: true
          vlans:
            - vlan_id: 100
              static_groups:
                - group: 233.252.0.10
                  interfaces:
                    - port-channel20
                    - port-channel21
        state: overridden
      register: result

    - name: Assert that before dict was correctly generated
      ansible.builtin.assert:
        that: result['before'] == before

    - name: Assert that correct set of commands were generated
      ansible.builtin.assert:
        that: overridden['commands'] == result['commands']

    - name: Assert that after dict was correctly generated
      ansible.builtin.assert:
        that: overridden['after'] == result['after']

    - name: Override the IGMP snooping configuration (idempotent)
      cisco.nxos.nxos_igmp_snooping: *id001
      register: result

    - name: Assert that the previous task was idempotent
      ansible.builtin.assert:
        that:
          - result['changed'] == false
          - result.commands|length == 0

  always:
    - ansible.builtin.include_tasks: _remove_config.yaml
