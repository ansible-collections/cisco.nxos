---
- ansible.builtin.debug:
    msg: START nxos_igmp_snooping parsed integration tests on connection={{ ansible_connection }}

- name: Parse externally provided IGMP snooping configuration
  register: result
  cisco.nxos.nxos_igmp_snooping:
    running_config: "{{ lookup('file', './fixtures/parsed.cfg') }}"
    state: parsed

- name: Assert that configuration was correctly parsed
  ansible.builtin.assert:
    that:
      - parsed == result['parsed']
