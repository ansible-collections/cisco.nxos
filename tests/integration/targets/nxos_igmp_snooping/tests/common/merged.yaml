---
- ansible.builtin.debug:
    msg: START nxos_igmp_snooping merged integration tests on connection={{ ansible_connection }}

- ansible.builtin.include_tasks: _remove_config.yaml

- ansible.builtin.include_tasks: _populate_config.yaml

- block:
    - name: Merge the provided configuration with the existing running configuration
      cisco.nxos.nxos_igmp_snooping: &id001
        config:
          link_local_groups_suppression: false
          group_timeout: "500"
          vlans:
            - vlan_id: 100
              static_groups:
                - group: 233.252.0.10
                  interfaces:
                    - Po20
                    - port-channel21
                - group: 233.252.0.12
                  interfaces:
                    - Po21
        state: merged
      register: result

    - name: Assert that before dict was correctly generated
      ansible.builtin.assert:
        that: result['before'] == before

    - name: Assert that correct set of commands were generated
      ansible.builtin.assert:
        that: merged['commands'] == result['commands']

    - name: Assert that after dict was correctly generated
      ansible.builtin.assert:
        that: merged['after'] == result['after']

    - name: Check that the static group is known to IGMP snooping
      cisco.nxos.nxos_command:
        commands:
          - show ip igmp snooping groups vlan 100
      register: groups

    - name: Assert that the new static group is listed
      ansible.builtin.assert:
        that: "'233.252.0.12' in groups.stdout[0]"

    - name: Merge the provided configuration with the existing running configuration (idempotent)
      cisco.nxos.nxos_igmp_snooping: *id001
      register: result

    - name: Assert that the previous task was idempotent
      ansible.builtin.assert:
        that:
          - result['changed'] == false
          - result.commands|length == 0

    - name: The group timeout cannot be set while snooping is disabled
      cisco.nxos.nxos_igmp_snooping:
        config:
          snooping: false
          group_timeout: "10"
        state: merged
      register: result
      ignore_errors: true

    - name: Assert that the task failed before touching the device
      ansible.builtin.assert:
        that:
          - result['failed'] == true
          - result['msg'] == 'group_timeout cannot be set while snooping is, or is being set to, false'

  always:
    - ansible.builtin.include_tasks: _remove_config.yaml
