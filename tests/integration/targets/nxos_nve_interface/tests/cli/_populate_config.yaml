---
- name: Populate NVE interface configuration
  cisco.nxos.nxos_nve_interface:
    config:
      enabled: true
      description: vxlan vtep
      advertise_virtual_rmac: true
      host_reachability_bgp: true
      source_interface_name: loopback1
      source_interface_hold_time: 60
      global_multicast_group:
        address: 233.252.0.20
        mode: L2
      vnis:
        - vni_id: 11111
          associate_vrf: true
        - vni_id: 22222
        - vni_id: 33333
          suppress_arp: true
        - vni_id: 44444
          mcast_group:
            address: 233.252.0.10
        - vni_id: 55555
          mcast_group:
            address: 233.252.0.11
            secondary_address: 233.252.0.12
    state: merged
