---
- ansible.builtin.debug:
    msg: Start Deleted integration state for nxos_nve_interface ansible_connection={{ ansible_connection }}

- ansible.builtin.include_tasks: _remove_config.yaml
- ansible.builtin.include_tasks: _populate_config.yaml

- block:
    - name: Delete NVE configurations handled by this module.
      cisco.nxos.nxos_nve_interface:
        state: deleted
      register: result

    - name: Assert that correct set of commands were generated.
      ansible.builtin.assert:
        that:
          - "{{ deleted['commands'] | symmetric_difference(result['commands']) | length == 0 }}"

    - name: Assert that before dicts are correctly generated.
      ansible.builtin.assert:
        that:
          - "{{ merged['after'] | symmetric_difference(result['before']) | length == 0 }}"

    - name: Assert that after dict is correctly generated.
      ansible.builtin.assert:
        that:
          - "{{ deleted['after'] | symmetric_difference(result['after']) | length == 0 }}"

  always:
    - ansible.builtin.include_tasks: _remove_config.yaml

- ansible.builtin.include_tasks: _remove_config.yaml
- ansible.builtin.include_tasks: _populate_config.yaml

- block:
    - name: Delete only the listed VNIs.
      cisco.nxos.nxos_nve_interface:
        config: "{{ deleted_vnis['config'] }}"
        state: deleted
      register: result

    - name: Assert that only the listed VNIs are removed.
      ansible.builtin.assert:
        that:
          - result['changed'] == true
          - result['commands'] == deleted_vnis['commands']
          - result['after'] == deleted_vnis['after']

    - name: Gather facts to check that the other VNIs and attributes remain.
      cisco.nxos.nxos_nve_interface:
        state: gathered
      register: gathered_result

    - name: Assert the other VNIs remain on the device.
      ansible.builtin.assert:
        that:
          - gathered_result['gathered'] == deleted_vnis['after']

    - name: Delete the listed VNIs again (idempotent).
      cisco.nxos.nxos_nve_interface:
        config: "{{ deleted_vnis['config'] }}"
        state: deleted
      register: result

    - name: Assert that the second run changes nothing.
      ansible.builtin.assert:
        that:
          - result['changed'] == false
          - result['commands'] == []

  always:
    - ansible.builtin.include_tasks: _remove_config.yaml
