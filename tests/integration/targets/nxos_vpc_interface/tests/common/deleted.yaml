---
- ansible.builtin.debug:
    msg: "Start nxos_vpc_interface deleted integration tests connection={{ ansible_connection }}"

- ansible.builtin.include_tasks: _populate_config.yaml

- block:
    - name: Delete the VPC configuration of the listed port-channels
      cisco.nxos.nxos_vpc_interface: &id001
        config:
          - name: port-channel10
        state: deleted
      register: result

    - name: Assert that before dicts were correctly generated
      ansible.builtin.assert:
        that:
          - merged['before'] == result['before']

    - name: Assert that correct set of commands were generated
      ansible.builtin.assert:
        that:
          - deleted['commands'] == result['commands']

    - name: Assert that after dicts were correctly generated
      ansible.builtin.assert:
        that:
          - deleted['after'] == result['after']

    - name: Delete the VPC configuration of the listed port-channels (idempotent)
      cisco.nxos.nxos_vpc_interface: *id001
      register: result

    - name: Assert that the previous task was idempotent
      ansible.builtin.assert:
        that:
          - result['changed'] == false
          - result.commands|length == 0

  always:
    - ansible.builtin.include_tasks: _remove_config.yaml

- ansible.builtin.include_tasks: _populate_config.yaml

- block:
    - name: Delete all VPC interface configuration
      cisco.nxos.nxos_vpc_interface: &id002
        state: deleted
      register: result

    - name: Assert that correct set of commands were generated
      ansible.builtin.assert:
        that:
          - deleted_all['commands'] == result['commands']

    - name: Assert that after dicts were correctly generated
      ansible.builtin.assert:
        that:
          - result['after'] == []

    - name: Delete all VPC interface configuration (idempotent)
      cisco.nxos.nxos_vpc_interface: *id002
      register: result

    - name: Assert that the previous task was idempotent
      ansible.builtin.assert:
        that:
          - result['changed'] == false
          - result.commands|length == 0

  always:
    - ansible.builtin.include_tasks: _remove_config.yaml
