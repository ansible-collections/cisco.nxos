---
- ansible.builtin.debug:
    msg: START Replaced nxos_pim_global state for integration tests on connection={{ ansible_connection }}

- ansible.builtin.include_tasks: _remove_config.yaml
- ansible.builtin.include_tasks: _populate_config.yaml

- block:
    - name: Replace the global PIM configuration
      cisco.nxos.nxos_pim_global: &id001
        config: "{{ replaced['config'] }}"
        state: replaced
      register: result

    - name: Assert that correct set of commands were generated
      ansible.builtin.assert:
        that:
          - "{{ replaced['commands'] | symmetric_difference(result['commands']) | length == 0 }}"

    - name: Replace the global PIM configuration (idempotent)
      cisco.nxos.nxos_pim_global: *id001
      register: result

    - name: Assert that the previous task was idempotent
      ansible.builtin.assert:
        that:
          - result['changed'] == false
  always:
    - ansible.builtin.include_tasks: _remove_config.yaml
    - name: Remove the RP that only the replaced test configures
      cisco.nxos.nxos_pim_global:
        config:
          rp_addresses:
            - rp_address: 192.0.2.5
              group_list: 239.255.253.0/24
        state: deleted
