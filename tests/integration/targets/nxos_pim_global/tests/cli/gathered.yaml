---
- ansible.builtin.debug:
    msg: START nxos_pim_global gathered integration tests on connection={{ ansible_connection }}

- ansible.builtin.include_tasks: _remove_config.yaml
- ansible.builtin.include_tasks: _populate_config.yaml

- block:
    - name: Gather the global PIM configuration using gathered
      cisco.nxos.nxos_pim_global:
        state: gathered
      register: result

    - name: Assert the result
      ansible.builtin.assert:
        that:
          - result['changed'] == false
          - result['gathered']['log_neighbor_changes'] == parsed['config']['log_neighbor_changes']
          - result['gathered']['register_rate_limit'] == parsed['config']['register_rate_limit']
          - result['gathered']['ssm_range'] | sort == parsed['config']['ssm_range'] | sort
          - parsed['config']['rp_addresses'] | difference(result['gathered']['rp_addresses']) | length == 0
          - parsed['config']['anycast_rps'] | difference(result['gathered']['anycast_rps']) | length == 0
  always:
    - ansible.builtin.include_tasks: _remove_config.yaml
