---
- ansible.builtin.debug:
    msg: START nxos_features gathered integration tests on connection={{ ansible_connection }}

- ansible.builtin.include_tasks: _remove_config.yaml
- ansible.builtin.include_tasks: _populate_config.yaml

- block:
    - name: Gather the features using gathered
      cisco.nxos.nxos_features:
        state: gathered
      register: result

    - name: Assert the result
      ansible.builtin.assert:
        that:
          - result['changed'] == false
          - config | difference(result['gathered']) | length == 0
  always:
    - ansible.builtin.include_tasks: _remove_config.yaml
