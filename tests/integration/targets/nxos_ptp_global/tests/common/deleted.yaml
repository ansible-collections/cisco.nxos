---
- ansible.builtin.debug:
    msg: "Start nxos_ptp_global deleted integration tests connection={{ ansible_connection }}"

- ansible.builtin.include_tasks: _remove_config.yaml

- ansible.builtin.include_tasks: _populate_config.yaml

- block:
    - name: Delete the PTP global configuration
      cisco.nxos.nxos_ptp_global: &id001
        state: deleted
      register: result

    - name: Assert that before dicts were correctly generated
      ansible.builtin.assert:
        that:
          - before == result['before']

    - name: Assert that correct set of commands were generated
      ansible.builtin.assert:
        that:
          - deleted['commands'] == result['commands']

    - name: Assert that after dicts were correctly generated
      ansible.builtin.assert:
        that:
          - deleted['after'] == result['after']

    - name: Delete the PTP global configuration (idempotent)
      cisco.nxos.nxos_ptp_global: *id001
      register: result

    - name: Assert that the previous task was idempotent
      ansible.builtin.assert:
        that:
          - result['changed'] == false
          - result.commands|length == 0

  always:
    - ansible.builtin.include_tasks: _remove_config.yaml
