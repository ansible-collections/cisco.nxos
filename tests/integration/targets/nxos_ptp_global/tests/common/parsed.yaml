---
- ansible.builtin.debug:
    msg: START nxos_ptp_global parsed integration tests on connection={{ ansible_connection }}

- name: Parse externally provided PTP global configuration
  register: result
  cisco.nxos.nxos_ptp_global:
    running_config: "{{ lookup('file', './fixtures/parsed.cfg') }}"
    state: parsed

- name: Assert that configuration was correctly parsed
  ansible.builtin.assert:
    that:
      - before == result['parsed']
