---
- ansible.builtin.debug:
    msg: "Start nxos_evpn_vnis overridden integration tests connection={{ ansible_connection }}"

- ansible.builtin.include_tasks: _populate_config.yaml

- block:
    - name: Override the EVPN VNI configuration
      cisco.nxos.nxos_evpn_vnis: &id001
        config:
          - vni: 10100
            route_distinguisher: auto
            route_target_both:
              - auto
        state: overridden
      register: result

    - name: Assert that before dicts were correctly generated
      ansible.builtin.assert:
        that:
          - merged['before'] == result['before']

    - name: Assert that correct set of commands were generated
      ansible.builtin.assert:
        that:
          - overridden['commands'] == result['commands']

    - name: Assert that after dicts were correctly generated
      ansible.builtin.assert:
        that:
          - overridden['after'] == result['after']

    - name: Override the EVPN VNI configuration (idempotent)
      cisco.nxos.nxos_evpn_vnis: *id001
      register: result

    - name: Assert that the previous task was idempotent
      ansible.builtin.assert:
        that:
          - result['changed'] == false
          - result.commands|length == 0

  always:
    - ansible.builtin.include_tasks: _remove_config.yaml
