---
- ansible.builtin.debug:
    msg: START route_target_evpn nxos_vrf_address_family integration tests on connection={{ ansible_connection }}

- ansible.builtin.include_tasks: _remove_config.yaml

- block:
    - name: Create an empty VRF1 so the address-family starts clean
      cisco.nxos.nxos_config:
        lines:
          - vrf context VRF1

    - name: Merge route-target both and both evpn
      register: result
      cisco.nxos.nxos_vrf_address_family: &id001
        config:
          - name: VRF1
            address_families:
              - afi: ipv4
                safi: unicast
                route_target:
                  - both: auto
                  - both: auto
                    evpn: true
        state: merged

    - name: Assert that correct set of commands were generated
      ansible.builtin.assert:
        that:
          - route_target_evpn['merged']['commands'] | symmetric_difference(result['commands']) | length == 0

    - name: Gather route-target facts from the device
      register: gathered
      cisco.nxos.nxos_vrf_address_family:
        state: gathered

    - name: Assert that the route-targets were gathered with evpn
      ansible.builtin.assert:
        that:
          - gathered['gathered'] | selectattr('name', 'equalto', 'VRF1') | list | length == 1

    - name: Merge route-target both and both evpn (idempotent)
      register: result
      cisco.nxos.nxos_vrf_address_family: *id001

    - name: Assert that task was idempotent
      ansible.builtin.assert:
        that:
          - result['changed'] == false

    - name: Replace with a single route-target entry
      register: result
      cisco.nxos.nxos_vrf_address_family: &id002
        config:
          - name: VRF1
            address_families:
              - afi: ipv4
                safi: unicast
                route_target:
                  - both: auto
        state: replaced

    - name: Assert that the evpn route-target was removed
      ansible.builtin.assert:
        that:
          - result['changed'] == true
          - route_target_evpn['replaced']['commands'] | symmetric_difference(result['commands']) | length == 0

    - name: Replace with a single route-target entry (idempotent)
      register: result
      cisco.nxos.nxos_vrf_address_family: *id002

    - name: Assert that task was idempotent
      ansible.builtin.assert:
        that:
          - result['changed'] == false
  always:
    - ansible.builtin.include_tasks: _remove_config.yaml
