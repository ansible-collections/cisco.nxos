---
- ansible.builtin.debug:
    msg: START nxos_ptp_interfaces parsed integration tests on connection={{ ansible_connection }}

- name: Parse externally provided PTP interfaces configuration
  register: result
  cisco.nxos.nxos_ptp_interfaces:
    running_config: "{{ lookup('file', './fixtures/parsed.cfg') }}"
    state: parsed

- name: Assert that configuration was correctly parsed
  ansible.builtin.assert:
    that:
      - parsed == result['parsed']
