---
- ansible.builtin.debug:
    msg: "Start nxos_ptp_interfaces replaced integration tests connection={{ ansible_connection }}"

- ansible.builtin.include_tasks: _remove_config.yaml

- ansible.builtin.include_tasks: _populate_config.yaml

- block:
    - name: Replace the PTP interfaces configuration
      cisco.nxos.nxos_ptp_interfaces: &id001
        config:
          - name: "{{ nxos_int1 }}"
            enabled: true
            vlan: 150
          - name: "{{ nxos_int2 }}"
            enabled: true
        state: replaced
      register: result

    - name: Assert that before dicts were correctly generated
      ansible.builtin.assert:
        that:
          - before == result['before']

    - name: Assert that correct set of commands were generated
      ansible.builtin.assert:
        that:
          - replaced['commands'] == result['commands']

    - name: Assert that after dicts were correctly generated
      ansible.builtin.assert:
        that:
          - replaced['after'] == result['after']

    - name: Replace the PTP interfaces configuration (idempotent)
      cisco.nxos.nxos_ptp_interfaces: *id001
      register: result

    - name: Assert that the previous task was idempotent
      ansible.builtin.assert:
        that:
          - result['changed'] == false
          - result.commands|length == 0

  always:
    - ansible.builtin.include_tasks: _remove_config.yaml
