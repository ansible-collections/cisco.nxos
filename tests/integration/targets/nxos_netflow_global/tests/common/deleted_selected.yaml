---
- ansible.builtin.debug:
    msg: "Start nxos_netflow_global deleted_selected integration tests connection={{ ansible_connection }}"

- ansible.builtin.include_tasks: _remove_config.yaml

- ansible.builtin.include_tasks: _populate_config.yaml

- block:
    - name: Delete the NetFlow configuration
      cisco.nxos.nxos_netflow_global: &id001
        config:
          monitors:
            - name: ansible_mon2
          exporters:
            - name: ansible_exp2
            - name: ansible_unknown
          records:
            - name: ansible_rec2
        state: deleted
      register: result

    - name: Assert that before dicts were correctly generated
      ansible.builtin.assert:
        that:
          - before == result['before']

    - name: Assert that correct set of commands were generated
      ansible.builtin.assert:
        that:
          - deleted_selected['commands'] == result['commands']

    - name: Assert that after dicts were correctly generated
      ansible.builtin.assert:
        that:
          - deleted_selected['after'] == result['after']

    - name: Delete the NetFlow configuration (idempotent)
      cisco.nxos.nxos_netflow_global: *id001
      register: result

    - name: Assert that the previous task was idempotent
      ansible.builtin.assert:
        that:
          - result['changed'] == false
          - result.commands|length == 0

  always:
    - ansible.builtin.include_tasks: _remove_config.yaml
