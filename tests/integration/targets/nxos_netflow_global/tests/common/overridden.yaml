---
- ansible.builtin.debug:
    msg: "Start nxos_netflow_global overridden integration tests connection={{ ansible_connection }}"

- ansible.builtin.include_tasks: _remove_config.yaml

- ansible.builtin.include_tasks: _populate_config.yaml

- block:
    - name: Override the NetFlow configuration
      cisco.nxos.nxos_netflow_global: &id001
        config:
          exporters:
            - name: ansible_exp2
              destination:
                address: 198.51.100.5
          records:
            - name: ansible_rec1
              match:
                ipv4:
                  source_address: true
                  destination_address: true
              collect:
                counter:
                  bytes: true
          monitors:
            - name: ansible_mon1
              record: ansible_rec1
              exporters:
                - ansible_exp2
        state: overridden
      register: result

    - name: Assert that before dicts were correctly generated
      ansible.builtin.assert:
        that:
          - before == result['before']

    - name: Assert that correct set of commands were generated
      ansible.builtin.assert:
        that:
          - overridden['commands'] == result['commands']

    - name: Assert that after dicts were correctly generated
      ansible.builtin.assert:
        that:
          - overridden['after'] == result['after']

    - name: Override the NetFlow configuration (idempotent)
      cisco.nxos.nxos_netflow_global: *id001
      register: result

    - name: Assert that the previous task was idempotent
      ansible.builtin.assert:
        that:
          - result['changed'] == false
          - result.commands|length == 0

  always:
    - ansible.builtin.include_tasks: _remove_config.yaml
