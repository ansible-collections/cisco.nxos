---
- name: Make sure that feature netflow is enabled
  cisco.nxos.nxos_feature:
    feature: netflow
    state: enabled
  vars:
    ansible_connection: ansible.netcommon.network_cli

- name: Populate the NetFlow configuration
  cisco.nxos.nxos_config:
    lines: "{{ item.lines }}"
    parents: "{{ item.parents | default(omit) }}"
  loop:
    - lines:
        - flow timeout 30
    - parents: flow exporter ansible_exp1
      lines:
        - description Collector 1
        - destination 192.0.2.10 use-vrf management
        - transport udp 9996
        - source loopback1
        - dscp 10
    - parents:
        - flow exporter ansible_exp1
        - version 9
      lines:
        - template data timeout 600
        - option exporter-stats timeout 300
    - parents: flow exporter ansible_exp2
      lines:
        - destination 198.51.100.5
    - parents: flow record ansible_rec1
      lines:
        - description IPv4 flows
        - match ipv4 source address
        - match ipv4 destination address
        - match transport source-port
        - collect counter bytes
    - parents: flow record ansible_rec2
      lines:
        - match datalink mac source-address
        - collect counter packets
    - parents: flow monitor ansible_mon1
      lines:
        - description Monitor 1
        - record ansible_rec1
        - exporter ansible_exp1
        - exporter ansible_exp2
    - parents: flow monitor ansible_mon2
      lines:
        - record netflow-original
        - exporter ansible_exp2
