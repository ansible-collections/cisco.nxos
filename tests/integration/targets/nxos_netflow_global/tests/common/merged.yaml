---
- ansible.builtin.debug:
    msg: "Start nxos_netflow_global merged integration tests connection={{ ansible_connection }}"

- ansible.builtin.include_tasks: _remove_config.yaml

- ansible.builtin.include_tasks: _populate_config.yaml

- block:
    - name: Merge the NetFlow configuration
      cisco.nxos.nxos_netflow_global: &id001
        config:
          timeout: 10
          exporters:
            - name: ansible_exp1
              dscp: 0
              source: Loopback2
              option_interface_table_timeout: 400
            - name: ansible_exp3
              destination:
                address: 2001:db8::1
                vrf: management
          records:
            - name: ansible_rec1
              match:
                ip:
                  protocol: true
                transport:
                  source_port: false
              collect:
                counter:
                  packets: true
          monitors:
            - name: ansible_mon2
              record: netflow ipv4 original-input
              description: Monitor 2
        state: merged
      register: result

    - name: Assert that before dicts were correctly generated
      ansible.builtin.assert:
        that:
          - before == result['before']

    - name: Assert that correct set of commands were generated
      ansible.builtin.assert:
        that:
          - merged['commands'] == result['commands']

    - name: Assert that after dicts were correctly generated
      ansible.builtin.assert:
        that:
          - merged['after'] == result['after']

    - name: Merge the NetFlow configuration (idempotent)
      cisco.nxos.nxos_netflow_global: *id001
      register: result

    - name: Assert that the previous task was idempotent
      ansible.builtin.assert:
        that:
          - result['changed'] == false
          - result.commands|length == 0

  always:
    - ansible.builtin.include_tasks: _remove_config.yaml
